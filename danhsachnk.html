<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Nhập kho</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#f5f5f7; --card:#fff; --text:#111; --muted:#6b7280; --line:#e5e7eb;
      --blue:#007aff; --red:#ef4444; --green:#22c55e; --amber:#f59e0b;
      --radius:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; display:flex; flex-direction:column;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}

    /* Thẻ + khu lọc */
    .wrap { padding:16px; display:flex; flex-direction:column; gap:12px; flex:1 1 auto; min-height:0; }
    .card{
      background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:0 1px 0 rgba(0,0,0,.03);
    }
    .filters{
      display:flex; flex-wrap:wrap; gap:10px; padding:12px;
      align-items:center;
    }
    .pill{
      display:flex; align-items:center; gap:8px;
      padding:4px 8px; /* thấp hơn */
      border:1px solid var(--line); border-radius:12px; background:#fff;
    }
    .pill label{font-size:12px; color:var(--muted)}
    .pill input, .pill select{
      border:none; outline:none; font-size:14px; background:transparent; min-height:24px;
    }
    .pill select{
      min-width:140px; appearance:none; padding-right:18px;
      background:linear-gradient(45deg,transparent 50%,var(--muted) 50%) right 8px center/8px 8px no-repeat;
    }
    .pill button{
      border:none; background:var(--blue); color:#fff; padding:8px 12px; border-radius:12px;
      font-weight:600; cursor:pointer
    }
    .pill button:active{opacity:.85}
    .pill:has(button){border:none;background:transparent;padding:0;}

    /* Meta ở bên phải hàng lọc */
    .meta{
      display:flex; gap:10px; align-items:center; color:var(--muted); font-size:13px;
      margin-left:auto;  /* đẩy sát phải */
    }
    .chip{background:#eef2ff; color:#1e40af; padding:4px 10px; border-radius:999px; font-weight:600}

    /* Bảng */
    .table-wrap{margin-top:12px}
    .table-wrapper{
      border:1px solid var(--line); border-radius:12px; overflow:auto; max-height: 100%; background:#fff;
    }
    table{width:100%; border-collapse:separate; border-spacing:0}
    th, td{padding:10px 12px; text-align:center; border-bottom:1px solid var(--line); font-size:14px}
    thead th{
      position:sticky; top:0; z-index:2; background:#fafafa; font-weight:700; color:#111;
      border-bottom:1px solid var(--line);
    }
    tfoot td{
      position:sticky; bottom:0; z-index:1; background:#fbfbfb; font-weight:700; border-top:1px solid var(--line);
    }
    tbody tr:hover{background:#fafafa}

    /* Checkbox iOS */
    .chk{appearance:none; width:18px; height:18px; border:2px solid #cbd5e1; border-radius:6px; cursor:pointer; position:relative}
    .chk:checked{border-color:var(--blue); background:var(--blue)}
    .chk:checked::after{content:""; position:absolute; left:4px; top:0px; width:6px; height:10px; border:2px solid #fff; border-top:none; border-left:none; transform:rotate(45deg)}

    /* Select trạng thái tô màu như badge */
    .tt-thanh-toan{
      border:none; border-radius:999px; padding:6px 12px; font-weight:600; cursor:pointer; text-align:center; appearance:none;
    }
    .tt-thanh-toan[value="chua"]{ background:#f1f5f9; color:#0f172a; }
    .tt-thanh-toan[value="da"]  { background:#ecfdf5; color:#065f46; }
    .tt-thanh-toan[value="dang"]{ background:#fffbeb; color:#92400e; }

    /* Nút thao tác */
    .btn-ghost{border:1px solid var(--line); background:#fff; padding:6px 10px; border-radius:10px; cursor:pointer}
    .btn-ghost:active{opacity:.85}
    .btn-icon{font-size:18px; line-height:0}
    .btn-danger{border-color:#fecaca; color:#b91c1c}
    tr.row-nhapkho{color:#065f46; font-weight:600;}

    .summary{margin-top:8px; display:flex; gap:8px; align-items:center; color:var(--muted); font-size:13px; padding-left:2px;}

    @media (max-width:900px){
      th:nth-child(5), td:nth-child(5){display:none;} /* Ẩn Mã KH trên màn hình nhỏ */
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Bộ lọc -->
    <div class="card">
      <div class="filters">
        <div class="pill">
          <label>Hành động</label>
          <select id="chonHanhDong">
            <option value="">— Chọn —</option>
            <option value="nhapkho">Ghi sổ</option>
            <option value="in">In hàng loạt</option>
            <option value="xoa">Xóa hóa đơn</option>
            <option value="thanhtoan">Thanh toán</option>
          </select>
        </div>
        <div class="pill">
          <label>Từ</label>
          <input type="date" id="tuNgay">
        </div>
        <div class="pill">
          <label>Đến</label>
          <input type="date" id="denNgay">
        </div>
        <div class="pill">
          <label>Mã KH</label>
          <input type="text" id="maKH" placeholder="Nhập mã KH...">
        </div>
        <div class="pill">
          <button id="btnLoc">🔍 Lọc</button>
          <button onclick="moFormNhap()">Đặt hàng</button>
        </div>

        <!-- Meta đếm -->
        <div class="meta">
          <span>Đã chọn:</span>
          <span class="chip" id="demChon">0</span>
          <span>| Tổng:</span>
          <span class="chip" id="tongTatCaTop">0 ₫</span>
        </div>
      </div>
    </div>

    <!-- Bảng -->
    <div class="table-wrap card" style="flex:1 1 auto; min-height:0; padding:8px">
      <div class="table-wrapper">
        <table id="bangHD">
          <thead>
            <tr>
              <th style="width:44px"><input id="chkAll" type="checkbox" class="chk"></th>
              <th style="min-width:120px ;text-align:left">Số HĐ</th>
              <th style="min-width:200px ;text-align:left">Ghi chú</th>
              <th style="min-width:120px">Ngày</th>
              <th style="min-width:100px">Mã KH</th>
              <th style="min-width:140px">Tổng tiền</th>
              <th style="min-width:160px">TT thanh toán</th>
              <th style="min-width:160px">Thanh toán</th>
              <th style="min-width:140px">Thao tác</th>
            </tr>
          </thead>
          <tbody></tbody>
          <tfoot>
            <tr>
              <td colspan="5" style="text-align:right">Tổng</td>
              <td id="tongTatCa">0 ₫</td>
              <td colspan="3"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <div class="summary">
      Gợi ý: Chọn nhiều hoá đơn → dùng “Hành động” để In/Xoá/Đánh dấu đã thanh toán.
    </div>
  </div>
  <link rel="stylesheet" href="/shared/mobile-fix.css">
  <script src="/shared/mobile-fix.js" defer></script>

  <script type="module">
    import { supabase } from './supabase.config.js';

    let duLieuGoc = [];
    const $ = s => document.querySelector(s);
    const $$ = s => Array.from(document.querySelectorAll(s));
    const fmtVND = n => (n||0).toLocaleString("vi-VN") + " ₫";

    // ======= Load danh sách =======
    async function taiDanhSach(){
      const tu   = $("#tuNgay").value;
      const den  = $("#denNgay").value;
      const makh = $("#maKH").value.trim();

      let query = supabase
        .from("hoadon")
        .select("sohd,ngay,makh,ghichu,tongthanhtoan,tinhtrang,thanhtoan,trangthai")
        .eq("phanloai", "nk")
        .order("ngay", { ascending:false })
        .order("sohd", { ascending:false });

      if (tu)  query = query.gte("ngay", tu);
      if (den) query = query.lte("ngay", den);
      if (makh)query = query.ilike("makh", `%${makh}%`);

      const { data, error } = await query;
      if (error) { alert("Lỗi tải dữ liệu! " + error.message); return; }

      duLieuGoc = data || [];
      veBang(duLieuGoc);
    }

    // ======= Vẽ bảng =======
    function veBang(data){
      const tbody = $("#bangHD tbody");
      tbody.innerHTML = "";

      let tong = 0;

      data.forEach(hd => {
        const khoa = hd.trangthai === "da nhap kho"
        const tien = parseFloat(String(hd.tongthanhtoan ?? "0").replace(/[^\d.-]/g,"")) || 0;
        tong += tien;

        const tr = document.createElement("tr");

        if(hd.trangthai === "da nhap kho"){
          tr.classList.add("row-nhapkho")
        }
        const tt = (hd.tinhtrang || "chua");
        const thanhtoanSo = parseFloat(hd.thanhtoan || 0) || 0;

        tr.innerHTML = `
          <td><input type="checkbox" class="chk chonHD" value="${hd.sohd}"></td>
          <td style="text-align:left; font-weight:700">${hd.sohd}</td>
          <td style="text-align:left; color:var(--muted)">${hd.ghichu || ""}</td>
          <td>${hd.ngay || ""}</td>
          <td>${hd.makh || ""}</td>
          <td style="font-weight:700">${fmtVND(tien)}</td>
          <td>
            <select class="tt-thanh-toan">
              <option value="chua">Chưa thanh toán</option>
              <option value="da">Đã thanh toán</option>
              <option value="dang">Đang xử lý</option>
            </select>
          </td>
          <td>
            <input class="thanh-toan" type="text" value="${tt==='da'? fmtVND(tien): (thanhtoanSo? fmtVND(thanhtoanSo): '')}"
              ${tt==='dang' ? '' : 'readonly'}
              placeholder="${tt==='dang' ? 'Nhập số tiền đã trả' : ''}"
              style="width:100%; border:1px solid var(--line); border-radius:10px; padding:8px 10px; text-align:right; background:#fff;"
            />
          </td>
          <td>
            <div style="display:flex; gap:8px; justify-content:center">
              ${
              khoa
              ? `<button class="btn-ghost btn-icon" disabled style="opacity:.35;cursor:not-allowed">👁️</button>`
              : `<button class="btn-ghost btn-icon" data-view="${hd.sohd}">👁️</button>`
              }
              <button class="btn-ghost btn-icon" data-print="${hd.sohd}" title="In">🖨️</button>
              ${
              khoa
              ? `<button class="btn-ghost btn-icon btn-danger" disabled style="opacity:.35;cursor:not-allowed">🗑️</button>`
              : `<button class="btn-ghost btn-icon btn-danger" data-del="${hd.sohd}">🗑️</button>`
              }
            </div>
          </td>
        `;
        tbody.appendChild(tr);

        // init select + input (đúng, không lồng listener)
        const select = tr.querySelector(".tt-thanh-toan");
        const input  = tr.querySelector(".thanh-toan");

        // màu theo trạng thái
        select.value = tt;
        select.setAttribute("value", tt);

        // trạng thái ban đầu
        if (tt === "da") {
          input.value = fmtVND(tien);
          input.readOnly = true;
          input.placeholder = "";
          input.style.color = "";
        } else if (tt === "dang") {
          input.readOnly = false;
          input.placeholder = "Nhập số tiền đã trả";
          if (thanhtoanSo) input.value = fmtVND(thanhtoanSo);
        } else {
          input.value = "0 ₫";
          input.readOnly = true;
          input.placeholder = "";
          input.style.color = "";
        }

        if (thanhtoanSo > 0 && thanhtoanSo < tien){
          input.style.color = "red";
          input.title = "Thanh toán chưa đủ";
        }

        // đổi trạng thái
        select.addEventListener("change", async () => {
          select.setAttribute("value", select.value); // cập nhật màu
          const val = select.value;

          if (val === "da"){
            input.value = fmtVND(tien);
            input.readOnly = true;
            input.placeholder = "";
            input.style.color = "";
            await capNhatTT(hd.sohd, "da", tien);
          } else if (val === "dang"){
            input.value = "";
            input.readOnly = false;
            input.placeholder = "Nhập số tiền đã trả";
            await capNhatTT(hd.sohd, "dang", null);
          } else {
            input.value = "0 ₫";
            input.readOnly = true;
            input.placeholder = "";
            input.style.color = "";
            await capNhatTT(hd.sohd, "chua", null);
          }
        });

        // nhập số tiền khi đang xử lý
        input.addEventListener("blur", async () => {
          if (select.value === "dang"){
            const so = parseFloat(String(input.value).replace(/[^\d.-]/g,"")) || 0;
            await capNhatTT(hd.sohd, "dang", so);
            if (so < tien){ input.style.color="red"; input.title="Thanh toán chưa đủ"; }
            else { input.style.color=""; input.title=""; }
            input.value = so ? fmtVND(so) : "";
          }
        });
      });

      $("#tongTatCa").textContent = fmtVND(tong);
      $("#tongTatCaTop").textContent = fmtVND(tong);
      capNhatDemChon();
    }

    // ======= Helpers chọn nhiều =======
    function capNhatDemChon(){
      const n = $$(".chonHD:checked").length;
      $("#demChon").textContent = n;
    }
    function layDanhSachDaChon(){
      return $$(".chonHD:checked").map(cb => cb.value);
    }

    // ======= Hành động =======
    async function xoaNhieu(ds){
      if (!confirm(`Xóa ${ds.length} hóa đơn?`)) return;
      for (const sohd of ds){
        const { data: hd } = await supabase
        .from("hoadon")
        .select("trangthai")
        .eq("sohd", sohd)
        .single()
        
        if(hd?.trangthai === "da nhap kho"){
        alert(`Hóa đơn ${sohd} đã nhập kho, không được xóa`)
        continue
      }
        await supabase.from("chitiet").delete().eq("sohd", sohd);
        await supabase.from("hoadon").delete().eq("sohd", sohd);
      }
      alert("✅ Đã xóa!");
      await taiDanhSach();
    }
    
    function inHD(sohd){ window.open(`formIn.html?sohd=${sohd}`, "_blank", "width=900,height=600"); }
    function xemHD(sohd){
      parent.openTab(
        "hd-"+sohd,
        "HĐ "+sohd,
        "ghihd.html?sohd="+sohd
      )
    }
    function inNhieu(ds){ ds.forEach(sohd => inHD(sohd)); }

    async function thanhToanNhieu(ds){
      for (const sohd of ds){
        const row  = $$("#bangHD tbody tr").find(r => r.children[1]?.textContent.trim() === sohd);
        if (!row) continue;
        const tien = parseFloat(row.children[5].textContent.replace(/[^\d.-]/g,"")) || 0;

        await supabase.from("hoadon").update({ tinhtrang:"da", thanhtoan:tien }).eq("sohd", sohd);

        // update UI
        const select = row.querySelector(".tt-thanh-toan");
        const input  = row.querySelector(".thanh-toan");
        if (select){ select.value = "da"; select.setAttribute("value","da"); }
        if (input){
          input.value = fmtVND(tien);
          input.readOnly = true; input.placeholder = ""; input.style.color = "";
        }
      }
      alert("✅ Đã thanh toán các hóa đơn đã chọn!");
    }

    async function capNhatTT(sohd, tinhtrang, thanhtoan){
      const { error } = await supabase.from("hoadon").update({ tinhtrang, thanhtoan }).eq("sohd", sohd);
      if (error) console.error("❌ Lỗi cập nhật TT:", error.message);
    }

  async function monhapkho(dsSoHD){

  for(const sohd of dsSoHD){

    // 1️⃣ kiểm tra đã ghi kho chưa
    const { data: check } = await supabase
      .from("stock_ledger")
      .select("id")
      .eq("ref_id", sohd)
      .eq("ref_type", "nk")
      .limit(1);

    if(check?.length){
      alert(`Hóa đơn ${sohd} đã ghi kho rồi`);
      continue;
    }

    // 2️⃣ lấy chi tiết hóa đơn
    const { data: chitiet, error } = await supabase
      .from("chitiet")
      .select("*")
      .eq("sohd", sohd);

    if(error){
      alert(error.message);
      continue
    }
    if(!chitiet?.length) continue

    const maspList = chitiet.map(r=>r.masp)
    const { data: sp } = await supabase
      .from("sanpham")
      .select("masp,parent_id,dinhluong,is_stock_parent")
      .in("masp", maspList)

    const spMap={}
    sp.forEach(s=>spMap[s.masp]=s)

   

    const ledgerRows = chitiet.map(r=>{
    let masp = r.masp
    let qty = Number(r.soluong)

    const sp = spMap[r.masp]

    // nếu nhập nhầm SP con → đổi sang SP cha
    if(sp && sp.parent_id && !sp.is_stock_parent){

    masp = sp.parent_id
    qty = qty * (sp.dinhluong || 1)
  }
    return{
    kho_id: r.kho_id,
    masp,
    qty,
    ref_type:"nk",
    ref_id: sohd,
    sohd: sohd,
    ngay: r.ngay || new Date()
  }

  })

    // 4️⃣ ghi vào stock_ledger
    const { error: err2 } = await supabase
      .from("stock_ledger")
      .insert(ledgerRows);

    if(err2){
      alert("Lỗi ghi kho: " + err2.message);
      return;
    }

    await supabase
    .from("hoadon")
    .update({ trangthai: "da nhap kho" })
    .eq("sohd", sohd);

    }

  alert("✅ Đã ghi sổ nhập kho");
}

function setMacDinhNgay(){

const d = new Date()

const y = d.getFullYear()
const m = String(d.getMonth()+1).padStart(2,"0")
const day = String(d.getDate()).padStart(2,"0")

// ngày đầu tháng
$("#tuNgay").value = `${y}-${m}-01`

// ngày hôm nay
$("#denNgay").value = `${y}-${m}-${day}`

}
    // ======= Events =======
    $("#btnLoc").addEventListener("click", taiDanhSach);

    $("#chonHanhDong").addEventListener("change", async (e)=>{
      const action = e.target.value; e.target.value = "";
      const ds = layDanhSachDaChon();
      if (!ds.length) { alert("Vui lòng chọn hóa đơn!"); return; }
      if (action === "xoa") await xoaNhieu(ds);
      else if (action === "nhapkho") await monhapkho(ds);
      else if (action === "in") inNhieu(ds);
      else if (action === "thanhtoan") await thanhToanNhieu(ds);
    });

    $("#chkAll").addEventListener("change", (e)=>{
      $$(".chonHD").forEach(cb => cb.checked = e.target.checked);
      capNhatDemChon();
    });

    document.addEventListener("change", (e)=>{
      if (e.target.classList?.contains("chonHD")) capNhatDemChon();
    });

    document.addEventListener("click", (e)=>{
      const v = e.target.getAttribute?.("data-view");
      const p = e.target.getAttribute?.("data-print");
      const d = e.target.getAttribute?.("data-del");
      if(e.target.disabled) return
      if (v) xemHD(v);
      if (p) inHD(p);
      if (d) xoaNhieu([d]);
    });

    // Tải lần đầu
    setMacDinhNgay()
    taiDanhSach();

    function moFormNhap(){
      parent.openTab(
        "hd-new",
        "Đặt hàng",
        "ghihd.html?phanLoai=ncc"
      )
    }
    window.moFormNhap = moFormNhap;
  </script>
</body>
</html>
