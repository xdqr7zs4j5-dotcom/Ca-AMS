<!DOCTYPE html>

<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chuyển kho</title>
  <style>
    body { font-family: Arial; padding: 20px; max-width: 500px; margin: auto; }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      background: #007aff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Chuyển kho</h2>

  <input id="masp" placeholder="Mã sản phẩm (VD: NVL002)" />

  <input id="kho_from" placeholder="Kho nguồn (UUID)" />
  <input id="kho_to" placeholder="Kho đích (UUID)" />

  <input id="qty" type="number" placeholder="Số lượng" />

  <input id="note" placeholder="Ghi chú (optional)" />

<button onclick="chuyenKho()">Chuyển kho</button>

  <pre id="log"></pre>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js'

    // 🔴 THAY 2 dòng này bằng của bạn
    const supabase = createClient(
      'https://qvifxqsgjsvvdjfclyjm.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2aWZ4cXNnanN2dmRqZmNseWptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQwMzc0MDcsImV4cCI6MjA2OTYxMzQwN30.egiHCr2zYRZyf6kwJk7xgcRYD5dqhU-n1H_Dnuo-jso'
    );

    const log = (msg) => {
      document.getElementById('log').textContent = JSON.stringify(msg, null, 2)
    }

    window.chuyenKho = async () => {
      const masp = document.getElementById('masp').value.trim()
      const kho_from = document.getElementById('kho_from').value.trim()
      const kho_to = document.getElementById('kho_to').value.trim()
      const qty = Number(document.getElementById('qty').value)
      const note = document.getElementById('note').value

      if (!masp || !kho_from || !kho_to || !qty) {
        alert('Nhập thiếu dữ liệu')
        return
      }

      if (kho_from === kho_to) {
        alert('Kho giống nhau')
        return
      }

      try {
        const { error } = await supabase.rpc('transfer_kho_full', {
          p_masp: masp,
          p_kho_from: kho_from,
          p_kho_to: kho_to,
          p_qty: qty,
          p_note: note
        })

        if (error) {
          console.error(error)
          log(error)
          alert('❌ Lỗi chuyển kho')
          return
        }

        log('✅ Chuyển kho thành công')
        alert('Thành công')

      } catch (err) {
        console.error(err)
        log(err)
      }
    }
  </script>

</body>
</html>
