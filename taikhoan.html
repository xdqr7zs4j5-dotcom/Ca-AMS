<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Thiết lập – Tài khoản</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0; background:#f2f2f7; color:#000; }
    .topbar {
     position: sticky; /* cố định khi cuộn */
     top: 0;
     background: #f2f2f7;
     display: flex;
     justify-content: space-between;
     align-items: center;
     padding: 10px 16px;
     border-bottom: none;
     z-index: 10;
     }
     .topbar h2 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
    }
    .actions {
        display: flex;
        gap: 8px;
    }
    button {
        padding: 8px 14px;
        border-radius: 8px;
        border: none;
        font-weight: 600;
        cursor: pointer;
    }
    .btn-primary { background: #007aff; color: #fff; }
    .btn-secondary { background: #e5e5ea; color: #000; }                                                         
    .card { background:#fff; border:1px solid #d1d1d6; border-radius:12px; overflow:hidden; margin:0 16px 20px; }
    .row { display:flex; flex-direction:column; gap:6px; padding:12px 16px; border-bottom:1px solid #e5e5ea; }
    .row:last-child{ border-bottom:none; }
    .label{ font-size:12px; color:#888; }
    input, textarea{
      border:none; border-bottom:1px solid #e5e5ea; font-size:16px; outline:none; padding:6px 0; background:#fff;
    }
    textarea{ resize:vertical; min-height:64px; }
    input:focus, textarea:focus{ border-bottom-color:#007aff; }
  </style>
</head>
<body>
  <!-- Thanh tiêu đề + nút -->
  <div class="topbar">
    <h2>👤 Thông tin tài khoản</h2>
    <div class="actions">
      <button class="btn-secondary" id="btnReload">↻ Tải lại</button>
      <button class="btn-primary" id="btnSave">💾 Lưu</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">Tên doanh nghiệp / người dùng</span>
      <input id="name" placeholder="VD: Cửa hàng ABC" />
    </div>
    <div class="row">
      <span class="label">Số tài khoản</span>
      <input id="stk" placeholder="VD: 0123456789 (VCB)" />
    </div>
    <div class="row">
      <span class="label">Số điện thoại</span>
      <input id="sdt_dn" inputmode="numeric" placeholder="VD: 0909 xxx xxx" />
    </div>
    <div class="row">
      <span class="label">Địa chỉ doanh nghiệp</span>
      <input id="dc_dn" placeholder="VD: 123 Lê Lợi, Q.1, TP.HCM" />
    </div>
    <div class="row">
      <span class="label">Lưu ý hiển thị trên hóa đơn (tùy chọn)</span>
      <textarea id="luuy" placeholder="VD: Thanh toán trong 7 ngày..."></textarea>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    const supabase = createClient(
      'https://qvifxqsgjsvvdjfclyjm.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2aWZ4cXNnanN2dmRqZmNseWptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQwMzc0MDcsImV4cCI6MjA2OTYxMzQwN30.egiHCr2zYRZyf6kwJk7xgcRYD5dqhU-n1H_Dnuo-jso'
    );

    const $ = id => document.getElementById(id);
    let currentId = null; // id của bản ghi đang chỉnh

    async function loadAccount() {
      const { data, error } = await supabase.from('taikhoan').select('*').order('id').limit(1);
      if (error) return alert('❌ Lỗi tải tài khoản: ' + error.message);

      const row = (data && data[0]) || null;
      currentId = row ? row.id : null;

      $('name').value = row?.name || '';
      $('stk').value  = row?.stk  || '';
      $('sdt_dn').value  = row?.sdt_dn  || '';
      $('dc_dn').value= row?.dc_dn|| '';
      $('luuy').value = row?.luuy || '';
    }

    async function saveAccount() {
      const payload = {
        name: $('name').value.trim(),
        stk:  $('stk').value.trim() || null,
        sdt_dn:  $('sdt_dn').value.trim() || null,
        dc_dn:$('dc_dn').value.trim() || null,
        luuy: $('luuy').value.trim() || null
      };

      // validate nhẹ
      if (!payload.name) return alert('⚠️ Vui lòng nhập "Tên doanh nghiệp / người dùng".');

      $('btnSave').disabled = true;

      if (currentId == null) {
        // insert mới
        const { data, error } = await supabase.from('taikhoan').insert(payload).select('id').single();
        if (error) { $('btnSave').disabled = false; return alert('❌ Lỗi lưu: ' + error.message); }
        currentId = data.id;
      } else {
        // update theo id hiện tại
        const { error } = await supabase.from('taikhoan').update(payload).eq('id', currentId);
        if (error) { $('btnSave').disabled = false; return alert('❌ Lỗi cập nhật: ' + error.message); }
      }

      $('btnSave').disabled = false;
      alert('✅ Đã lưu thông tin tài khoản.');
    }

    $('btnReload').addEventListener('click', loadAccount);
    $('btnSave').addEventListener('click', saveAccount);

    loadAccount();
  </script>
</body>
</html>
