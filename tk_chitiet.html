<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lịch sử tồn kho</title>

<style>
  :root{
    --bg:#f5f5f7; --card:#fff; --text:#111; --muted:#6b7280; --line:#e5e7eb;
    --blue:#007aff; --red:#ff3b30; --radius:14px; --shadow:0 6px 24px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:flex; flex-direction:column; background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; color:var(--text)
  }

  .wrap{padding:16px; display:flex; flex-direction:column; gap:12px; flex:1 1 auto; min-height:0}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
  .filters{display:flex; flex-wrap:wrap; gap:10px; padding:12px; align-items:center}
  .pill{display:flex; align-items:center; gap:8px; padding:4px 8px; border:1px solid var(--line); border-radius:999px; background:#fff}
  .pill label{font-size:12px; color:var(--muted)}
  .pill input,.pill select{border:none; outline:none; font-size:14px; background:transparent; min-height:24px}
  .pill select{
    min-width:140px; appearance:none; padding-right:18px;
    background:linear-gradient(45deg,transparent 50%,var(--muted) 50%) right 8px center/8px 8px no-repeat
  }
  .pill .btn{border:none; background:var(--blue); color:#fff; padding:8px 12px; border-radius:999px; font-weight:600; cursor:pointer}
  .pill .btn:active{opacity:.85}

  .meta{margin-left:auto; display:flex; gap:10px; align-items:center; color:var(--muted); font-size:13px}
  .chip{background:#eef2ff; color:#1e40af; padding:4px 10px; border-radius:999px; font-weight:700}

  .table-card{flex:1 1 auto; min-height:0; padding:8px}
  .table-wrap{
    overflow:auto; border-radius:12px; border:1px solid var(--line); background:#fff; height:100%
  }
  table{width:100%; border-collapse:separate; border-spacing:0}
  thead th{
    position:sticky; top:0; z-index:1; background:#fafafa; border-bottom:1px solid var(--line);
    font-size:13px; font-weight:700; color:#374151; text-align:left; padding:10px 12px
  }
  tbody td{border-bottom:1px solid var(--line); padding:10px 12px; vertical-align:middle; font-size:14px}
  tbody tr:hover{background:#fafbff}
  .cell-check{width:42px}
  .num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  .lowText{color:var(--red); font-weight:700}

  /* iOS checkbox */
  input.ios-check{appearance:none; -webkit-appearance:none; outline:none; margin:0; width:20px; height:20px;
    border-radius:6px; border:1.5px solid #cfd5df; background:#fff; display:inline-grid; place-content:center; cursor:pointer; transition:all .15s}
  input.ios-check:hover{border-color:#b8beca}
  input.ios-check:checked{background:var(--blue); border-color:var(--blue)}
  input.ios-check:checked::after{content:""; width:10px; height:6px; border:2px solid #fff; border-top:0; border-left:0; transform:rotate(45deg) translateY(-1px)}

  @media (max-width: 1000px){
    /* Ẩn Mã KH (cột 10) trên màn nhỏ */
    th:nth-child(10), td:nth-child(10){display:none;}
  }
</style>
</head>
<body>

<div class="wrap">
  <!-- Filters -->
  <div class="card">
    <div class="filters">
      <!-- Sắp xếp -->  
      <div class="pill">
        <label>Sắp xếp</label>
        <select id="sapXep">
          <option value="tensp_asc" selected>Tên SP (A→Z)</option>
          <option value="tensp_desc">Tên SP (Z→A)</option>
          <option value="date_desc">Ngày mới nhất</option>
          <option value="date_asc">Ngày cũ nhất</option>
        </select>
      </div>

      <!-- Loại chứng từ -->
      <div class="pill">
        <label>Loại</label>
        <select id="loaiCT">
          <option value="">Tất cả</option>
          <option value="nk">Nhập (NK)</option>
          <option value="xk">Xuất (XK)</option>
        </select>
      </div>

      <!-- Tìm -->
      <div class="pill" style="min-width:280px; flex:1">
        <label>Tìm</label>
        <input id="timTonKho" type="text" placeholder="Tìm mã/tên SP, chứng từ, mã KH…" style="width:100%">
      </div>

      <!-- Khoảng ngày -->
      <div class="pill">
        <label>Từ</label>
        <input id="tuNgay" type="date">
      </div>
      <div class="pill">
        <label>Đến</label>
        <input id="denNgay" type="date">
      </div>

      <button id="btnReset" class="pill btn" style="margin-left:6px;">Reset</button>

      <!-- Meta -->
      <div class="meta">
        <span>Kết quả:</span><span class="chip" id="demKetQua">0</span>
        <span>| Đã chọn:</span><span class="chip" id="demChon">0</span>
      </div>
    </div>
  </div>

  <!-- Bảng -->
  <div class="card table-card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="cell-check"><input id="chkAll" type="checkbox" class="ios-check"></th>
            <th>Ngày tạo</th>
            <th>Mã SP</th>
            <th>Tên SP</th>
            <th class="num">Tồn trước</th>
            <th class="num">Điều chỉnh</th>
            <th class="num">Tồn sau</th>
            <th>Ghi chú</th>
            <th>Chứng từ</th>
            <th>Mã KH</th>
          </tr>
        </thead>
        <tbody id="noiDungBang"></tbody>
      </table>
    </div>
  </div>
</div>
<link rel="stylesheet" href="/shared/mobile-fix.css">
<script src="/shared/mobile-fix.js" defer></script>

<!-- JS -->
<script type="module">
import { supabase } from "./supabase.config.js";

/* ===== DOM ===== */
const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

const tb        = $("#noiDungBang");
const ipTim     = $("#timTonKho");
const ipTu      = $("#tuNgay");
const ipDen     = $("#denNgay");
const lblCount  = $("#demKetQua");
const lblChon   = $("#demChon");
const chkAll    = $("#chkAll");
const selSort   = $("#sapXep");
const selLoai   = $("#loaiCT");

const tableWrap = document.querySelector(".table-card .table-wrap");

/* ===== State ===== */
let VIEW = [];                 // dữ liệu đang hiển thị
const SELECTED = new Set();
let pageFrom = 0;              // offset phân trang
const PAGE = 200;              // kích thước lô
let hasMore = true;
let loading = false;
let lastTotalCount = null;
let abortCtrl = null;
let io = null;                 // IntersectionObserver
let sentinel = null;           // cọc đánh dấu đáy để auto loadMore

/* ===== Utils ===== */
const fmtNum = n => (Number(n) || 0).toLocaleString("vi-VN");
const fmtDateTime = s => s ? new Date(s).toLocaleString("vi-VN", { timeZone:"Asia/Ho_Chi_Minh" }) : "";

/* ===== Query builder (server-side) ===== */
function buildQuery(){
  const FIELDS = "created_at, masp, tensp, tontruoc, dieuchinh, tonsau, ghichu, chungtu, makh";
  let q = supabase.from("td_tonkho").select(FIELDS, { count: "exact" });

  // Lọc Từ/Đến (GMT+7)
  const from = ipTu?.value ? ipTu.value + "T00:00:00+07:00" : null;
  const to   = ipDen?.value ? ipDen.value + "T23:59:59+07:00" : null;
  if(from) q = q.gte("created_at", from);
  if(to)   q = q.lte("created_at", to);

  // Lọc Loại theo dấu dieuchinh
  const loai = selLoai?.value || "";
  if (loai === "nk") q = q.gt("dieuchinh", 0);
  if (loai === "xk") q = q.lt("dieuchinh", 0);

  // Tìm kiếm
  const kw = ipTim?.value?.trim();
  if (kw) {
    const like = `%${kw}%`;
    q = q.or(`tensp.ilike.${like},masp.ilike.${like},chungtu.ilike.${like},makh.ilike.${like}`);
  }

  // Sắp xếp
  const sortMode = selSort?.value || "tensp_asc";
  if (sortMode === "date_desc") {
    q = q.order("created_at", { ascending:false });
  } else if (sortMode === "date_asc") {
    q = q.order("created_at", { ascending:true });
  } else if (sortMode === "tensp_desc") {
    q = q.order("tensp", { ascending:false, nullsFirst:true })
         .order("created_at", { ascending:false });
  } else { // tensp_asc
    q = q.order("tensp", { ascending:true, nullsFirst:true })
         .order("created_at", { ascending:false });
  }

  return q;
}

/* ===== Load 1 trang ===== */
async function loadMore(){
  if (loading || !hasMore) return;
  loading = true;

  // hủy request cũ nếu cần
  if (abortCtrl) abortCtrl.abort();
  abortCtrl = new AbortController();

  try{
    const q = buildQuery();
    const { data, error, count } = await q
      .range(pageFrom, pageFrom + PAGE - 1)
      .abortSignal(abortCtrl.signal);

    if (error) throw error;

    lastTotalCount = count ?? lastTotalCount;

    if (!data || data.length === 0) {
      hasMore = false;
      detachObserver();
      return;
    }

    VIEW.push(...data);
    pageFrom += data.length;

    render(VIEW);
    updateMeta();

    // nếu số trả về < PAGE thì đã hết
    if (data.length < PAGE) {
      hasMore = false;
      detachObserver();
    }
  } catch (err) {
    if (err.name !== "AbortError") console.error("❌ Lỗi tải trang:", err);
  } finally {
    loading = false;
  }
}

/* ===== Reload khi đổi filter/sort ===== */
function reload(){
  pageFrom = 0; hasMore = true; VIEW = []; SELECTED.clear();
  tb.innerHTML = ""; updateMeta();

  // tạo/đặt sentinel cuối .table-wrap
  if (!sentinel) {
    sentinel = document.createElement("div");
    sentinel.style.height = "1px";
  }
  // đảm bảo sentinel nằm SAU table
  if (tableWrap && tableWrap.lastElementChild !== sentinel) {
    tableWrap.appendChild(sentinel);
  }

  // (re)attach observer
  attachObserver();

  // tải trang đầu
  loadMore();
}

/* ===== IntersectionObserver cho vô hạn cuộn ===== */
function attachObserver(){
  detachObserver();
  if (!tableWrap || !sentinel) return;
  io = new IntersectionObserver((entries)=>{
    const e = entries[0];
    if (e.isIntersecting) loadMore();
  }, { root: tableWrap, rootMargin: "600px 0px", threshold: 0 });
  io.observe(sentinel);
}
function detachObserver(){
  if (io) { io.disconnect(); io = null; }
}

/* ===== Render ===== */
function render(ds){
  const frag = document.createDocumentFragment();

  ds.slice(tb.rows.length).forEach(r => {
    const key = [r.created_at, r.masp, r.chungtu ?? "", r.dieuchinh ?? "", r.tonsau ?? ""].join("|");
    const checked = SELECTED.has(key);

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="cell-check">
        <input type="checkbox" class="chk ios-check" data-key="${key}" ${checked ? "checked" : ""}>
      </td>
      <td>${fmtDateTime(r.created_at)}</td>
      <td class="mono">${r.masp || ""}</td>
      <td>${r.tensp || ""}</td>
      <td class="num">${fmtNum(r.tontruoc)}</td>
      <td class="num">${fmtNum(r.dieuchinh)}</td>
      <td class="num ${Number(r.tonsau) < 50 ? "lowText" : ""}">${fmtNum(r.tonsau)}</td>
      <td>${r.ghichu || ""}</td>
      <td>${r.chungtu || ""}</td>
      <td>${r.makh || ""}</td>
    `;
    frag.appendChild(tr);
  });

  tb.appendChild(frag);

  // bind checkbox mới render
  $$("#noiDungBang .chk").forEach(cb=>{
    if (cb._bound) return;
    cb._bound = true;
    cb.addEventListener("change", ()=>{
      const k = cb.dataset.key;
      if(cb.checked) SELECTED.add(k); else SELECTED.delete(k);
      updateMeta(); syncMasterCheckbox();
    });
  });

  syncMasterCheckbox();
}

function updateMeta(){
  lblCount.textContent = (lastTotalCount ?? VIEW.length).toString();
  lblChon.textContent  = SELECTED.size.toString();
}

function syncMasterCheckbox(){
  const total = tb.rows.length;
  if(total === 0){ chkAll.checked=false; chkAll.indeterminate=false; return; }

  let checkedInView = 0;
  $$("#noiDungBang .chk").forEach(cb => { if (cb.checked) checkedInView++; });

  if(checkedInView === 0){ chkAll.checked=false; chkAll.indeterminate=false; }
  else if(checkedInView === total){ chkAll.checked=true; chkAll.indeterminate=false; }
  else{ chkAll.checked=false; chkAll.indeterminate=true; }
}

/* ===== Events ===== */
let t;
ipTim?.addEventListener("input", ()=>{ clearTimeout(t); t = setTimeout(reload, 250); });
[ipTu, ipDen, selLoai, selSort].forEach(el => el?.addEventListener("change", reload));

chkAll?.addEventListener("change", e=>{
  const check = e.target.checked;
  $$("#noiDungBang .chk").forEach(c => {
    c.checked = check;
    const k = c.dataset.key;
    if(check) SELECTED.add(k); else SELECTED.delete(k);
  });
  updateMeta(); syncMasterCheckbox();
});

/* ===== Init ===== */
document.addEventListener("DOMContentLoaded", reload);
</script>
</body>
</html>
