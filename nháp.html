<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Realistic Soap Bubble (SVG + Filters)</title>
<style>
  :root{
    --size: 560;      /* đường kính bong bóng (px) */
    --rim: 14;        /* độ dày viền */
    --bg: #e7eff6;    /* nền */
  }
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:var(--bg);font-family:system-ui,Segoe UI,Roboto,Arial}
  svg{width:min(92vmin, calc(var(--size)*1px)); height:auto; display:block}
  /* nhẹ nhàng “thở” */
  @media (prefers-reduced-motion:no-preference){
    #bubble{animation:float 9s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  }
</style>
</head>
<body>

<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- BÓNG ĐỔ -->
    <filter id="blur10" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- GLASS: ánh sáng gương + khuếch tán -->
    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <!-- soften alpha để specular không gắt cạnh -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.8" result="sa"/>
      <!-- specular highlight (điểm sáng bóng) -->
      <feSpecularLighting in="sa" surfaceScale="2.2" specularConstant="1.2" specularExponent="28" lighting-color="white" result="spec">
        <!-- nguồn sáng từ trên-trái -->
        <fePointLight x="-240" y="-240" z="280"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specCut"/>
      <!-- fill mờ bên trong cho cảm giác thể tích -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.3" result="soft"/>
      <!-- trộn: screen để tăng sáng, over để trả hình -->
      <feBlend in="soft" in2="specCut" mode="screen"/>
    </filter>

    <!-- Gradient lòng kính (thể tích + lạnh/ấm) -->
    <radialGradient id="glassFill" cx="55%" cy="36%" r="65%">
      <stop offset="0%"  stop-color="white" stop-opacity="0.90"/>
      <stop offset="12%" stop-color="white" stop-opacity="0.55"/>
      <stop offset="32%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.06"/>
      <stop offset="80%" stop-color="white" stop-opacity="0.00"/>
    </radialGradient>
    <radialGradient id="cool" cx="30%" cy="88%" r="70%">
      <stop offset="0%" stop-color="#5fb0ff" stop-opacity=".18"/>
      <stop offset="55%" stop-color="#5fb0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="82%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#ffb869" stop-opacity=".16"/>
      <stop offset="55%" stop-color="#ffb869" stop-opacity="0"/>
    </radialGradient>

    <!-- Flare 8 cánh -->
    <filter id="flareBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>

    <!-- Viền cầu vồng: dùng nhiều cung (arc) với linearGradient xoay -->
    <linearGradient id="gBlue" gradientUnits="userSpaceOnUse" x1="140" y1="120" x2="420" y2="120">
      <stop offset="0"   stop-color="#48a8ff" stop-opacity=".95"/>
      <stop offset="1"   stop-color="#9be9ff" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="gCyan" gradientUnits="userSpaceOnUse" x1="220" y1="720" x2="520" y2="700">
      <stop offset="0" stop-color="#7fe3ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#4aaaff" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="gGold" gradientUnits="userSpaceOnUse" x1="560" y1="150" x2="760" y2="260">
      <stop offset="0" stop-color="#ffe68a" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffb080" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="gMag" gradientUnits="userSpaceOnUse" x1="620" y1="540" x2="770" y2="460">
      <stop offset="0" stop-color="#ffa7ff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#6fc2ff" stop-opacity=".95"/>
    </linearGradient>

    <!-- Mép kính xanh mảnh bao ngoài -->
    <radialGradient id="edgeBlue" cx="52%" cy="52%" r="50%">
      <stop offset="78%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="88%" stop-color="#a9d0ff" stop-opacity=".35"/>
      <stop offset="95%" stop-color="#7ab6ff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="rgba(120,180,255,0)"/>
    </radialGradient>
  </defs>

  <!-- bóng đổ -->
  <ellipse cx="450" cy="740" rx="170" ry="44" fill="rgba(0,0,0,.22)" filter="url(#blur10)"/>

  <!-- hạt nhỏ -->
  <g opacity=".95">
    <circle cx="200" cy="650" r="14" fill="url(#edgeBlue)"/>
    <circle cx="200" cy="650" r="14" fill="white" opacity=".12"/>
    <circle cx="690" cy="240" r="14" fill="url(#edgeBlue)"/>
    <circle cx="690" cy="240" r="14" fill="white" opacity=".12"/>
  </g>

  <!-- BONG BÓNG -->
  <g id="bubble" transform="translate(0,0)">
    <!-- lõi thể tích + ánh lạnh/ấm -->
    <circle cx="450" cy="450" r="260" fill="url(#glassFill)" filter="url(#glass)"/>
    <circle cx="450" cy="450" r="260" fill="url(#cool)"  opacity=".9"/>
    <circle cx="450" cy="450" r="260" fill="url(#warm)"  opacity=".9"/>

    <!-- vệt phản xạ lớn -->
    <path d="M610,310
             C650,330 680,360 690,390
             C640,400 600,415 560,430
             C545,400 560,360 610,310 Z"
          fill="white" opacity=".85" filter="url(#blur10)"/>

    <!-- vệt phụ -->
    <path d="M650,580
             C620,600 600,620 595,645
             C620,640 655,630 690,610
             C680,600 667,590 650,580 Z"
          fill="white" opacity=".28" filter="url(#blur10)"/>

    <!-- Flare 8 cánh -->
    <g transform="translate(300,300) rotate(18)">
      <g filter="url(#flareBlur)" opacity=".95">
        <rect x="-18" y="-1.5" width="36" height="3" fill="#ffffff"/>
        <rect x="-1.5" y="-18" width="3" height="36" fill="#ffffff"/>
        <rect x="-18" y="-1.5" width="36" height="3" transform="rotate(45)" fill="#ffffff"/>
        <rect x="-18" y="-1.5" width="36" height="3" transform="rotate(-45)" fill="#ffffff"/>
      </g>
    </g>

    <!-- mép kính xanh -->
    <circle cx="450" cy="450" r="260" fill="url(#edgeBlue)"/>

    <!-- VIỀN CẦU VỒNG: nhiều cung để giả lập conic -->
    <g fill="none" stroke-linecap="round" stroke-opacity=".95">
      <!-- top-left xanh -->
      <path d="M220,420
               A260,260 0 0 1 420,220"
            stroke="url(#gBlue)" stroke-width="14"/>
      <!-- bottom-left cyan -->
      <path d="M230,520
               A260,260 0 0 0 430,700"
            stroke="url(#gCyan)" stroke-width="14"/>
      <!-- top-right vàng cam -->
      <path d="M490,210
               A260,260 0 0 1 700,340"
            stroke="url(#gGold)" stroke-width="14"/>
      <!-- right tím/xanh -->
      <path d="M720,460
               A260,260 0 0 1 610,640"
            stroke="url(#gMag)" stroke-width="14"/>
    </g>

    <!-- viền kính mảnh bên ngoài để tăng tương phản -->
    <circle cx="450" cy="450" r="260"
            stroke="rgba(255,255,255,.35)" stroke-width="1.6" fill="none"/>
  </g>
</svg>

</body>
</html>
