<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Thiết lập – Bậc lương</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         margin:0;background:#f2f2f7;color:#000}
    .topbar{position:sticky;top:0;z-index:10;background:#f2f2f7;
            display:flex;justify-content:space-between;align-items:center;
            padding:10px 16px}
    .topbar h2{margin:0;font-size:20px;font-weight:600}
    .actions{display:flex;gap:8px}
    button{padding:8px 14px;border-radius:8px;border:none;font-weight:600;cursor:pointer}
    .btn-primary{background:#007aff;color:#fff}
    .btn-secondary{background:#e5e5ea;color:#000}

    .tips{margin:8px 16px 6px;color:#666;font-size:13px}
    .list{background:#fff;border-radius:12px;overflow:hidden;margin:0 16px;
          border:1px solid #ccc}
    .row{display:flex;align-items:flex-start;padding:10px 16px;border-bottom:1px solid #ccc;gap:16px}
    .row:last-child{border-bottom:none}
    .row.deleted{background:#ffe2e2;text-decoration:line-through;opacity:.6}

    .cell{flex:1;display:flex;flex-direction:column;gap:4px}
    .label{font-size:12px;color:#888}
    .editable{font-size:16px;color:#111;outline:none;border:none;background:transparent;
              min-height:20px;white-space:pre-wrap;word-break:break-word}
    .row-actions{margin-left:8px;display:flex;flex-direction:column;gap:4px}
    .row-actions button{padding:4px 8px;font-size:12px;border-radius:6px}
    .xoa{background:#ff3b30;color:#fff}
    .hoan-tac{background:#34c759;color:#fff;display:none}

    .warn{background:#fff6e6;border:1px solid #ffd590;color:#8a4b00;
          padding:8px 12px;border-radius:10px;margin:8px 16px;display:none}
  </style>
</head>
<body>
  <div class="topbar">
    <h2>Thiết lập bậc lương</h2>
    <div class="actions">
      <button class="btn-secondary" onclick="themDong()">+ Thêm dòng</button>
      <button class="btn-primary" onclick="luuThayDoi()">💾 Lưu</button>
    </div>
  </div>

  <div class="tips"><b>Gợi ý</b>: nhập % dưới dạng <b>0,5</b> nghĩa là <b>0.5%</b>. Hệ thống lưu dạng thập phân (0.005).</div>
  <div class="warn" id="warn"></div>
  <div class="list" id="listLuong"></div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    const supabase = createClient(
      'https://qvifxqsgjsvvdjfclyjm.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2aWZ4cXNnanN2dmRqZmNseWptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQwMzc0MDcsImV4cCI6MjA2OTYxMzQwN30.egiHCr2zYRZyf6kwJk7xgcRYD5dqhU-n1H_Dnuo-jso'
    );

    const list = document.getElementById('listLuong');
    const warn = document.getElementById('warn');
    let duLieuGoc = new Map();
    let deletedIds = new Set();

    const fmtNum = v => v? Number(v).toLocaleString('vi-VN'): '';
    const parseNum = s => {
      if (!s) return null;
      const n = Number(String(s).replace(/\./g,'').replace(/,/g,'')); 
      return isNaN(n)? null:n;
    };
    const fmtPctDisplay = d => d? (d*100).toString().replace('.', ',') : '';
    const parsePctToDecimal = s =>{
      if (!s) return null;
      const n=Number(String(s).replace('.', '').replace(',', '.'));
      return isNaN(n)? null:n/100;
    };
    const showWarn = msg=>{warn.textContent=msg||'';warn.style.display=msg?'block':'none';};

    function taoDong(r={}){
      const div=document.createElement('div');
      div.className='row';
      if(r.id) div.dataset.id=r.id;
      div.innerHTML=`
        <div class="cell"><span class="label">Tên bậc</span><div class="editable ten" contenteditable="true">${r.ten_bac||''}</div></div>
        <div class="cell"><span class="label">Doanh thu min</span><div class="editable min" contenteditable="true">${fmtNum(r.doanhthu_min)}</div></div>
        <div class="cell"><span class="label">Doanh thu max</span><div class="editable max" contenteditable="true">${fmtNum(r.doanhthu_max)}</div></div>
        <div class="cell"><span class="label">% hoa hồng</span><div class="editable pct" contenteditable="true">${fmtPctDisplay(r.pct_hoahong)}</div></div>
        <div class="row-actions">
          <button class="xoa">Xóa</button>
          <button class="hoan-tac">Hoàn tác</button>
        </div>`;
      const btnXoa=div.querySelector('.xoa');
      const btnUndo=div.querySelector('.hoan-tac');
      btnXoa.onclick=()=>{
        if(!div.dataset.id) div.remove();
        else{div.classList.add('deleted');btnXoa.style.display='none';btnUndo.style.display='block';deletedIds.add(Number(div.dataset.id));}
      };
      btnUndo.onclick=()=>{
        div.classList.remove('deleted');btnXoa.style.display='block';btnUndo.style.display='none';
        if(div.dataset.id) deletedIds.delete(Number(div.dataset.id));
      };
      return div;
    }

    function themDong(){list.appendChild(taoDong());}
    window.themDong=themDong;

    function layDuLieuHienTai(){
      return [...list.querySelectorAll('.row')].map(div=>({
        id: div.dataset.id? Number(div.dataset.id):null,
        ten_bac: div.querySelector('.ten').textContent.trim(),
        doanhthu_min: parseNum(div.querySelector('.min').textContent.trim()),
        doanhthu_max: parseNum(div.querySelector('.max').textContent.trim()),
        pct_hoahong: parsePctToDecimal(div.querySelector('.pct').textContent.trim()),
        deleted: div.classList.contains('deleted')
      }));
    }

    async function taiDuLieu(){
      const {data,error}=await supabase.from('thietlap_luong').select('*').order('doanhthu_min');
      if(error){alert('Lỗi tải:'+error.message);return;}
      list.innerHTML='';duLieuGoc.clear();deletedIds.clear();
      data.forEach(r=>{duLieuGoc.set(r.id,{...r});list.appendChild(taoDong(r));});
    }

    async function luuThayDoi(){
      const cur=layDuLieuHienTai();
      if(deletedIds.size){
        const {error}=await supabase.from('thietlap_luong').delete().in('id',[...deletedIds]);
        if(error){alert('Lỗi xoá:'+error.message);return;}
      }
      const upserts=[];
      for(const r of cur){
        if(r.deleted) continue;
        if(!r.id) upserts.push(r);
        else{
          const old=duLieuGoc.get(r.id);
          if(!old||old.ten_bac!==r.ten_bac||Number(old.doanhthu_min)!==r.doanhthu_min||Number(old.doanhthu_max)!==r.doanhthu_max||Number(old.pct_hoahong)!==r.pct_hoahong)
            upserts.push(r);
        }
      }
      if(upserts.length){
        const {error}=await supabase.from('thietlap_luong').upsert(upserts,{onConflict:'id'});
        if(error){alert('Lỗi lưu:'+error.message);return;}
      }
      alert('✅ Đã lưu thay đổi');taiDuLieu();
    }
    window.luuThayDoi=luuThayDoi;
    taiDuLieu();
  </script>
</body>
</html>
