<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a84ff" />
  <title>Cá AMS</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" sizes="192x192" href="./icons/icon-192.png">
  <link rel="icon" sizes="512x512" href="./icons/icon-512.png">

  <style>
    :root{
      --bg:#f5f5f7;
      --card:#fff;
      --text:#111;
      --muted:#6b7280;
      --line:#e5e7eb;
      --blue:#007aff;
      --radius:16px;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }

    /* ================= ROOT ================= */
    .app{
      height:100%;
      display:flex;
    }

    /* ================= DESKTOP ================= */
    body[data-ui="desktop"] .app{
      padding:16px;
      gap:16px;
    }

    body[data-ui="desktop"] .sidebar{
      width:200px;
      background:var(--card);
      border-radius:var(--radius);
      padding:14px;
      display:flex;
      flex-direction:column;
    }

    body[data-ui="desktop"].collapsed .sidebar{
      width:72px;
      padding:10px;
    }

    body[data-ui="desktop"] .content{
      flex:1;
      background:var(--card);
      border-radius:var(--radius);
      overflow:hidden;
    }

    /* ================= MOBILE ================= */
    body[data-ui="mobile"] .app{
      flex-direction:column;
      padding-top:var(--safe-top);
      padding-bottom:calc(56px + var(--safe-bottom));
    }

    body[data-ui="mobile"] .content{
      flex:1;
      background:var(--card);
    }

    body[data-ui="mobile"] .sidebar{
      position:fixed;
      inset:0 auto 0 0;
      width:78%;
      max-width:320px;
      height:100vh;
      background:#fff;
      transform:translateX(-100%);
      transition:.25s ease;
      z-index:300;

      display:flex;
      flex-direction:column;
    }

    body[data-ui="mobile"].menu-open .sidebar{
      transform:translateX(0);
    }

    body[data-ui="mobile"].menu-open::before{
      content:'';
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.35);
      z-index:200;
    }

    /* ================= SIDEBAR COMMON ================= */
    .sb-head{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:6px;
      margin-bottom:12px;
    }
    .sb-title{
      font-weight:700;
      padding:6px 10px;
      border-radius:8px;
      cursor:pointer;
    }
    .sb-title:hover{background:#f3f4f6}

    .toggle{
      border:0;
      background:transparent;
      cursor:pointer;
      font-size:16px;
      color:var(--muted);
    }

    .menu{
      display:flex;
      flex-direction:column;
      gap:6px;
      flex:1;   
      overflow-y:auto;  
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .item{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:10px;
      border:0;
      background:transparent;
      cursor:pointer;
      font-weight:600;
    }
    .item:hover{background:#f6f7fb}
    .item.active{
      background:#eef2ff;
      color:#1e40af;
    }
    .item .ic{width:24px;text-align:center}

    body[data-ui="desktop"].collapsed .item .txt{
      display:none;
    }

    /* ================= CONTENT ================= */
    iframe#view{
      width:100%;
      height:100%;
      border:0;
    }

    /* ================= TABBAR MOBILE ================= */
    .tabbar{
      display:none;
    }
    body[data-ui="mobile"] .tabbar{
      position:fixed;
      left:0; right:0; bottom:0;
      height:56px;
      background:#fff;
      border-top:1px solid var(--line);
      display:flex;
      z-index:400;
    }
    .tabbar button{
      flex:1;
      border:0;
      background:transparent;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      font-size:12px;
    }
    /* ================= SUBMENU ================= */
.menu-group{
  display:flex;
  flex-direction:column;
}

.menu-group .submenu{
  display:none;
  padding-left:10px;
  gap:4px;
}

.menu-group.open .submenu{
  display:flex;
  flex-direction:column; 
}

/* menu cha */
.item.parent{
  justify-content:flex-start;
}

/* mũi tên */
.item.parent .arrow{
  margin-left:auto;
  font-size:12px;
  transition:transform .2s ease;
  opacity:.6;
}

.menu-group.open .item.parent .arrow{
  transform:rotate(180deg);
}

/* menu con */
.item.sub{
  font-weight:500;
  font-size:14px;
  padding:8px 12px;
  opacity:.9;
}

.item.sub.active{
  background:#e0e7ff;
  color:#1e3a8a;
}

/* desktop collapsed: vẫn thấy submenu icon */
body[data-ui="desktop"].collapsed .submenu{
  padding-left:0;
}
body[data-ui="mobile"] .menu{
  padding-bottom: calc(56px + var(--safe-bottom));
}
.item.sub .ic{
  width:24px;
  text-align:center;
}
.menu-group{
  margin:0;
  padding:0;
}
.toggle{
  position:absolute;
  top:18px;
  left:40px;   /* vị trí ngoài sidebar */
  z-index:500;
}
.sidebar{
  position:relative;
}
  </style>

  <script type="module" src="./app.js" defer></script>
</head>

<body>
  <!-- Splash -->
  <div id="splash" hidden></div>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sb-head">
        <div class="sb-title" id="sbTitle">Trang chủ</div>
        <button class="toggle" id="btnToggle">☰</button>
      </div>
      <nav class="menu" id="menu"></nav>
    </aside>

    <!-- Content -->
    <main class="content">
      <iframe id="view" src="./begin.html"></iframe>
    </main>
  </div>

  <!-- Mobile Tabbar -->
  <nav class="tabbar" id="tabbar"></nav>

  <noscript>Cần bật JavaScript để sử dụng Cá AMS</noscript>
</body>
</html>
