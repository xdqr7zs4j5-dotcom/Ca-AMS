<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a84ff" />
  <title>Cá AMS</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" sizes="192x192" href="./icons/icon-192.png">
  <link rel="icon" sizes="512x512" href="./icons/icon-512.png">

  <style>
    :root{
      --bg:#f5f5f7;
      --card:#fff;
      --text:#111;
      --muted:#6b7280;
      --line:#e5e7eb;
      --blue:#007aff;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }

    /* ================= ROOT ================= */
    .app{
      height:100%;
      display:flex;
    }

    /* ================= DESKTOP ================= */
    body[data-ui="desktop"] .app{
      padding:0px;
      gap:2px;
    }

    body[data-ui="desktop"] .sidebar{
      width:200px;
      background:var(--card);
      border-radius:0;
      padding:0px 6px;
      display:flex;
      flex-direction:column;
    }

    body[data-ui="desktop"].collapsed .sidebar{
      width:70px;
      padding:0px 6px;
    }

    body[data-ui="desktop"] .content{
      flex:1;
      background:var(--card);
      border-radius:0;
      overflow:hidden;
    }

    /* ================= MOBILE ================= */
    body[data-ui="mobile"] .app{
      flex-direction:column;
      padding-top:var(--safe-top);
      padding-bottom:calc(56px + var(--safe-bottom));
    }

    body[data-ui="mobile"] .content{
      flex:1;
      background:var(--card);
    }

    body[data-ui="mobile"] .sidebar{
      position:fixed;
      inset:0 auto 0 0;
      width:78%;
      max-width:320px;
      height:100vh;
      background:#fff;
      transform:translateX(-100%);
      transition:.25s ease;
      z-index:300;

      display:flex;
      flex-direction:column;
    }

    body[data-ui="mobile"].menu-open .sidebar{
      transform:translateX(0);
    }

    body[data-ui="mobile"].menu-open::before{
      content:'';
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.35);
      z-index:200;
    }

    /* ================= SIDEBAR COMMON ================= */
    .sb-head{
      position:relative;
      display:flex;
      align-items:center;
      padding:10px 6px 6px;
      margin-bottom:12px;
    }
    .sb-title{
      font-weight:700;
      font-size:18px;
      padding:0px 4px;
      cursor:pointer;
    }
    .sb-title:hover{background:#f3f4f6}

    .toggle{
      position:absolute;
      right:-6px;
      top:55%;
      transform:translateY(-50%);
      border:0;
      background:transparent;
      cursor:pointer;
      font-size:18px;
      color:var(--muted);
    }
    .menu{
      display:flex;
      flex-direction:column;
      gap:6px;
      flex:1;   
      overflow-y:auto;  
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .item{
      display:flex;
      align-items:center;
      gap:10px;
      padding:8px;
      border:0;
      background:transparent;
      cursor:pointer;
      font-weight:600;
    }
    .item:hover{background:#f6f7fb}
    .item.active{
      background:#eef2ff;
      color:#1e40af;
    }
    .item .ic{width:30px;text-align:center;font-size:18px;}
    .content{ border-left:1px solid #e5e7eb;}

    body[data-ui="desktop"].collapsed .item .txt{
      display:none;
    }
    body[data-ui="desktop"].collapsed #sbTitle{
      font-size:0;
      width:34px;
      height:34px;
      background:url("./icons/icon-192.png") center/contain no-repeat;
      border-radius:12px;
    }
    body[data-ui="desktop"].collapsed #sbTitle::after{
      font-weight:700;
    }

    /* ================= CONTENT ================= */
    iframe#view{
      width:100%;
      height:100%;
      border:0;
    }

    /* ================= TABBAR MOBILE ================= */
    .tabbar{
      display:none;
    }
    body[data-ui="mobile"] .tabbar{
      position:fixed;
      left:0; right:0; bottom:0;
      height:56px;
      background:#fff;
      border-top:1px solid var(--line);
      display:flex;
      z-index:400;
    }
    .tabbar button{
      flex:1;
      border:0;
      background:transparent;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      font-size:12px;
    }
    /* ================= SUBMENU ================= */
.menu-group{
  display:flex;
  flex-direction:column;
}

.menu-group .submenu{
  display:none;
  padding-left:10px;
  gap:4px;
}

.menu-group.open .submenu{
  display:flex;
  flex-direction:column; 
}

/* menu cha */
.item.parent{
  justify-content:flex-start;
}

/* mũi tên */
.item.parent .arrow{
  margin-left:auto;
  font-size:12px;
  transition:transform .2s ease;
  opacity:.6;
}

.menu-group.open .item.parent .arrow{
  transform:rotate(180deg);
}

/* menu con */
.item.sub{
  font-weight:500;
  font-size:14px;
  padding:8px 12px;
  opacity:.9;
}

.item.sub.active{
  background:#e0e7ff;
  color:#1e3a8a;
}

/* desktop collapsed: vẫn thấy submenu icon */
body[data-ui="desktop"].collapsed .submenu{
  padding-left:0;
}
body[data-ui="desktop"].collapsed .toggle{
  opacity:0;
  pointer-events:none;
}
body[data-ui="desktop"].collapsed .sidebar:hover .toggle{
  opacity:1;
  pointer-events:auto;
}
body[data-ui="mobile"] .menu{
  padding-bottom: calc(56px + var(--safe-bottom));
}
.item.sub .ic{
  width:24px;
  text-align:center;
}
.menu-group{
  margin:0;
  padding:0;
}
.sidebar{
  position:relative;
}
.tabs{
  height:42px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  overflow-x:auto;
  gap:4px;
  padding:0 6px;
  background:#fafafa;
}

.tab{
  padding:6px 12px;
  border-radius:10px;
  background:#fff;
  border:1px solid var(--line);
  font-size:13px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
}

.tab.active{
  background:#eef2ff;
  color:#1e40af;
}

.tab .close{
  font-size:12px;
  opacity:.6;
  cursor:pointer;
}
#viewWrap{
  width:100%;
  height:calc(100% - 42px);
  position:relative;
}

.tab-frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  display:none;
}

.tab-frame.active{
  display:block;
}
.kpi-mini{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:12px;
  margin-right:10px;
  padding-right:10px;
  border-right:1px solid #e5e7eb;
}

.kpi-mini span{
  color:#374151;
}

.kpi-mini .red{color:#ff3b30}
.kpi-mini .yellow{color:#f59e0b}
.kpi-mini .green{color:#34c759}
  </style>

  <script type="module" src="./app.js" defer></script>
</head>

<body>
  <!-- Splash -->
  <div id="splash" hidden></div>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sb-head">
        <div class="sb-title" id="sbTitle">Cá AMS</div>
        <button class="toggle" id="btnToggle">☰</button>
      </div>
      <nav class="menu" id="menu"></nav>
    </aside>

    <!-- Content -->
    <main class="content">

  <div class="tabs" id="tabs">

  <div class="kpi-mini">
    <span>DT: <b id="miniRev">0</b></span>
    <span class="red">C: <b id="miniChua">0</b></span>
    <span class="yellow">Đ: <b id="miniDang">0</b></span>
    <span class="green">X: <b id="miniDa">0</b></span>
  </div>

</div>

<div id="viewWrap"></div>

</main>
  </div>

  <!-- Mobile Tabbar -->
  <nav class="tabbar" id="tabbar"></nav>

  <noscript>Cần bật JavaScript để sử dụng Cá AMS</noscript>
</body>
</html>
