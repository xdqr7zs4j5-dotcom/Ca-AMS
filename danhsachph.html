<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Nhập kho</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#f5f5f7; --card:#fff; --text:#111; --muted:#6b7280; --line:#e5e7eb;
      --blue:#007aff; --red:#ef4444; --green:#22c55e; --amber:#f59e0b;
      --radius:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; display:flex; flex-direction:column;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}

    /* Thẻ + khu lọc */
    .wrap { padding:8px; display:flex; flex-direction:column; gap:2px; flex:1 1 auto; min-height:0; }
    .card{
      background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:0 1px 0 rgba(0,0,0,.03);
    }
    .filters{
      display:flex; flex-wrap:wrap; gap:10px; padding:12px;
      align-items:center;
    }
    .pill{
      display:flex; align-items:center; gap:8px;
      padding:4px 8px; /* thấp hơn */
      border:1px solid var(--line); border-radius:12px; background:#fff;
    }
    .pill label{font-size:12px; color:var(--muted)}
    .pill input, .pill select{
      border:none; outline:none; font-size:14px; background:transparent; min-height:24px;
    }
    .pill select{
      min-width:140px; appearance:none; padding-right:18px;
      background:linear-gradient(45deg,transparent 50%,var(--muted) 50%) right 8px center/8px 8px no-repeat;
    }
    .pill button{
      border:none; background:var(--blue); color:#fff; padding:8px 12px; border-radius:12px;
      font-weight:600; cursor:pointer
    }
    .pill button:active{opacity:.85}
    .pill:has(button){border:none;background:transparent;padding:0;}

    /* Meta ở bên phải hàng lọc */
    .meta{
      display:flex; gap:10px; align-items:center; color:var(--muted); font-size:13px;
      margin-left:auto;  /* đẩy sát phải */
    }
    .chip{background:#eef2ff; color:#1e40af; padding:4px 10px; border-radius:999px; font-weight:600}

    /* Bảng */
    .table-wrap{margin-top:12px}
    .table-wrapper{
      border:1px solid var(--line); border-radius:12px; overflow:auto; max-height: 100%; background:#fff;
    }
    table{width:100%; border-collapse:separate; border-spacing:0}
    th, td{padding:10px 12px; text-align:center; border-bottom:1px solid var(--line); font-size:14px}
    thead th{
      position:sticky; top:0; z-index:2; background:#fafafa; font-weight:700; color:#111;
      border-bottom:1px solid var(--line);
    }
    tfoot td{
      position:sticky; bottom:0; z-index:1; background:#fbfbfb; font-weight:700; border-top:1px solid var(--line);
    }
    tbody tr:hover{background:#fafafa}

    /* Checkbox iOS */
    .chk{appearance:none; width:18px; height:18px; border:2px solid #cbd5e1; border-radius:6px; cursor:pointer; position:relative}
    .chk:checked{border-color:var(--blue); background:var(--blue)}
    .chk:checked::after{content:""; position:absolute; left:4px; top:0px; width:6px; height:10px; border:2px solid #fff; border-top:none; border-left:none; transform:rotate(45deg)}

    .badge{
padding:4px 10px;
border-radius:999px;
font-weight:600;
}

.badge-lap{
background:#eef2ff;
color:#1e40af;
}

.badge-xuat{
background:#ecfdf5;
color:#065f46;
}

.badge-ghiso{
background:#fffbeb;
color:#92400e;
}    .btn-ghost{border:1px solid var(--line); background:#fff; padding:6px 10px; border-radius:10px; cursor:pointer}
    .btn-ghost:active{opacity:.85}
    .btn-icon{font-size:18px; line-height:0}
    .btn-danger{border-color:#fecaca; color:#b91c1c}

    .summary{margin-top:8px; display:flex; gap:8px; align-items:center; color:var(--muted); font-size:13px; padding-left:2px;}

    @media (max-width:900px){
      th:nth-child(5), td:nth-child(5){display:none;} /* Ẩn Mã KH trên màn hình nhỏ */
    }
  </style>
</head>

<body>

<div class="wrap">

<!-- filter -->
<div class="card">
<div class="filters">

<div class="pill">
<label>Hành động</label>
<select id="chonHanhDong">
<option value="">— Chọn —</option>
<option value="in">In</option>
<option value="xoa">Xóa</option>
<option value="ghiso">Ghi sổ</option>
</select>
</div>

<div class="pill">
<label>Từ</label>
<input type="date" id="tuNgay">
</div>

<div class="pill">
<label>Đến</label>
<input type="date" id="denNgay">
</div>

<div class="pill">
<label>Mã KH</label>
<input type="text" id="maKH">
</div>

<div class="pill">
<button id="btnLoc">🔍 Lọc</button>
</div>

<div class="meta">
<span>Đã chọn</span>
<span class="chip" id="demChon">0</span>
</div>

</div>
</div>


<!-- table -->
<div class="table-wrap card" style="flex:1;min-height:0;padding:8px">

<div class="table-wrapper">

<table id="bangHD">

<thead>
<tr>
<th style="width:40px">
<input type="checkbox" id="chkAll" class="chk">
</th>
<th style="min-width:140px;text-align:left">Số phiếu</th>
<th style="min-width:220px;text-align:left">Ghi chú</th>
<th style="min-width:120px">Ngày</th>
<th style="min-width:120px">Mã KH</th>
<th style="min-width:140px">Tổng tiền</th>
<th style="min-width:140px">Tình trạng</th>
<th style="min-width:140px">Thao tác</th>
</tr>
</thead>

<tbody></tbody>

<tfoot>
<tr>
<td colspan="5" style="text-align:right">Tổng</td>
<td id="tongTatCa">0</td>
<td colspan="2"></td>
</tr>
</tfoot>

</table>

</div>
</div>

</div>


<script type="module">

import { supabase } from './supabase.config.js'

const $=s=>document.querySelector(s)
const $$=s=>document.querySelectorAll(s)

function fmt(n){
return (n||0).toLocaleString("vi-VN")+" ₫"
}

function capNhatDem(){
$("#demChon").textContent=[...$$(".chonHD:checked")].length
}

function layDanhSachDaChon(){
return [...$$(".chonHD:checked")].map(cb=>cb.value)
}


async function taiDanhSach(){

const tu=$("#tuNgay").value
const den=$("#denNgay").value
const makh=$("#maKH").value.trim()

let query=supabase
.from("hoadon")
.select("*")
.not("thamchieu","is",null)
.neq("thamchieu","")
.order("ngay",{ascending:false})

if(tu) query=query.gte("ngay",tu)
if(den) query=query.lte("ngay",den)
if(makh) query=query.ilike("makh",`%${makh}%`)

const {data,error}=await query

if(error){
alert(error.message)
return
}

veBang(data||[])
}


function veBang(data){

const tbody=$("#bangHD tbody")
tbody.innerHTML=""

let tong=0

data.forEach(hd=>{

const khoa = hd.trangthai === "da ghi so"
const tien=parseFloat(hd.tongtienvon)||0
tong+=tien

let badge=""
let text=""

if(hd.trangthai==="lap phieu"){
badge="badge-ghiso"
text="Đang xử lí"
}

if(hd.trangthai==="da xuat kho"){
badge="badge-lap"
text="Lập phiếu"
}

if(hd.trangthai==="da ghi so"){
badge="badge-xuat"
text="Đã xuất kho"
}

const tr=document.createElement("tr")
tr.dataset.sohd=hd.sohd

tr.innerHTML=`
<td><input type="checkbox" class="chk chonHD" value="${hd.thamchieu}"></td>

<td style="text-align:left;font-weight:700">
${hd.thamchieu}
</td>

<td 
 style="text-align:left"
 title="Ngày: ${hd.ngay || ""} 
 Ghi chú: ${hd.ghichu || ""}
 Mã KH: ${hd.makh || ""} 
 Tổng tiền: ${fmt(hd.tongthanhtoan || 0)}"
 >
<span style="color:#2563eb;font-weight:700">
${hd.sohd || ""}
</span>
</td>

<td>${hd.ngay||""}</td>

<td>${hd.makh||""}</td>

<td style="font-weight:700">${fmt(tien)}</td>

<td>
<span class="badge ${badge}">${text}</span>
</td>

<td>
<div style="display:flex;gap:8px;justify-content:center">

${
khoa
? `<button class="btn-ghost btn-icon" disabled style="opacity:.35;cursor:not-allowed">👁️</button>`
: `<button class="btn-ghost btn-icon" data-view="${hd.thamchieu}">👁️</button>`
}

<button class="btn-ghost btn-icon" data-print="${hd.sohd}">🖨️</button>

${
khoa
? `<button class="btn-ghost btn-icon btn-danger" disabled style="opacity:.35;cursor:not-allowed">🗑️</button>`
: `<button class="btn-ghost btn-icon btn-danger" data-del="${hd.sohd}">🗑️</button>`
}

</div>
</td>
`

tbody.appendChild(tr)

})

$("#tongTatCa").textContent=fmt(tong)
$("#chkAll").checked = false
capNhatDem()
}
async function xoaNhieu(ds){

if(!confirm("Xóa "+ds.length+" phiếu xuất kho?")) return

for(const sophieu of ds){
  const { data: hd } = await supabase
  .from("hoadon")
  .select("trangthai")
  .eq("thamchieu", sophieu)
  .single()

  if(hd?.trangthai === "da ghi so"){
    alert(`Phiếu ${sophieu} đã ghi sổ, không được xóa`)
    continue
  }

  // 1 xóa dữ liệu xuất kho
  await supabase
  .from("xuatkho")
  .delete()
  .eq("sophieu",sophieu)

  // 2 bỏ liên kết hóa đơn
  await supabase
  .from("hoadon")
  .update({ thamchieu:null, trangthai:"lap phieu"})
  .eq("thamchieu",sophieu)

}

taiDanhSach()

}
async function moxuatkho(dsPhieu){

for(const sophieu of dsPhieu){

  // 1 kiểm tra đã ghi sổ chưa
  const { data: check } = await supabase
  .from("stock_ledger")
  .select("id")
  .eq("ref_id", sophieu)
  .eq("ref_type", "xk")
  .limit(1)

  if(check?.length){
    alert(`Phiếu ${sophieu} đã ghi sổ rồi`)
    continue
  }

  // 2 lấy sohd
  const { data: hd } = await supabase
  .from("hoadon")
  .select("sohd")
  .eq("thamchieu", sophieu)
  .single()

  if(!hd){
    alert("Không tìm thấy hóa đơn")
    continue
  }

  // 3 lấy dữ liệu xuất kho
  const { data: rows, error } = await supabase
  .from("xuatkho")
  .select("*")
  .eq("sophieu", sophieu)

  if(error){
    alert(error.message)
    continue
  }

  if(!rows?.length) continue


  // 4 lấy thông tin sản phẩm
  const maspList = rows.map(r=>r.masp)

  const { data: sp } = await supabase
  .from("sanpham")
  .select("masp,parent_id,dinhluong,is_stock_parent")
  .in("masp", maspList)

  const spMap={}
  sp.forEach(s=> spMap[s.masp]=s )


  // 5 tạo ledger
  const ledgerRows = rows.map(r=>{

    const sp = spMap[r.masp]

    let masp = r.masp
    let qty = Number(r.soluong)
    if(r.ref_type === "xk"){
      qty = -qty
    }

    // nếu là sản phẩm con → đổi sang cha
    if(sp && sp.parent_id && !sp.is_stock_parent){
      masp = sp.parent_id
      qty = qty * (sp.dinhluong || 1)
    }

    return{
      kho_id: r.kho_id,
      masp,
      qty,
      ref_type:"xk",
      ref_id:sophieu,
      sohd:hd.sohd,
      ngay:r.ngay || new Date()
    }

  })


  // 6 ghi ledger
  const { error: err2 } = await supabase
  .from("stock_ledger")
  .insert(ledgerRows)

  if(err2){
    alert("Lỗi ghi sổ: "+err2.message)
    continue
  }

  // 7 update trạng thái
  await supabase
  .from("hoadon")
  .update({ trangthai:"da ghi so" })
  .eq("thamchieu", sophieu)

}

alert("✅ Đã ghi sổ xuất kho")

}
function inHD(sohd){
window.open(`xuatkho.html?sohd=${sohd}`,"_blank")
}

function inNhieu(ds){
ds.forEach(s=>inHD(s))
}


async function ghiSoNhieu(ds){

for(const sophieu of ds){

await supabase
.from("hoadon")
.update({trangthai:"da ghi so"})
.eq("thamchieu",sophieu)

}

taiDanhSach()

}
function setMacDinhNgay(){

const d = new Date()

const y = d.getFullYear()
const m = String(d.getMonth()+1).padStart(2,"0")
const day = String(d.getDate()).padStart(2,"0")

$("#tuNgay").value = `${y}-${m}-01`
$("#denNgay").value = `${y}-${m}-${day}`

}

$("#chonHanhDong").onchange = e=>{
 const action=e.target.value
 const ds=layDanhSachDaChon()

 if(!ds.length) return alert("Chưa chọn phiếu")

 if(action==="xoa") xoaNhieu(ds)
 if(action==="in") inNhieu(ds)
 if(action==="ghiso") moxuatkho(ds)

 e.target.value=""
}
$("#btnLoc").onclick=taiDanhSach

$("#chkAll").onchange=e=>{
$$(".chonHD").forEach(cb=>cb.checked=e.target.checked)
capNhatDem()
}

document.addEventListener("change",e=>{
if(e.target.classList.contains("chonHD")) capNhatDem()
})

document.addEventListener("click",e=>{

const v=e.target.getAttribute("data-view")
const p=e.target.getAttribute("data-print")
const d=e.target.getAttribute("data-del")

if(v) window.open(`ghihd.html?sophieu=${v}&nguon=xuatkho`)
if(p) inHD(p)
if(d) xoaNhieu([d])
if(e.target.disabled) return
})

document.addEventListener("dblclick",e=>{

const tr = e.target.closest("tr")
if(!tr) return

const sohd = tr.dataset.sohd
if(!sohd) return

window.open(`formIn.html?sohd=${sohd}`,"_blank")

})

setMacDinhNgay()
taiDanhSach()

</script>

</body>
</html>
