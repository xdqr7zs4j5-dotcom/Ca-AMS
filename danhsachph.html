<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>HĐ Khác</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#f5f5f7; --card:#fff; --text:#111; --muted:#6b7280; --line:#e5e7eb;
      --blue:#007aff; --red:#ef4444; --green:#22c55e; --amber:#f59e0b;
      --radius:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; display:flex; flex-direction:column;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}

    /* Thẻ + khu lọc */
    .wrap { padding:16px; display:flex; flex-direction:column; gap:12px; flex:1 1 auto; min-height:0; }
    .card{
      background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:0 1px 0 rgba(0,0,0,.03);
    }
    .filters{
      display:flex; flex-wrap:wrap; gap:10px; padding:12px;
      align-items:center;
    }
    .pill{
      display:flex; align-items:center; gap:8px;
      padding:4px 8px; /* thấp hơn */
      border:1px solid var(--line); border-radius:12px; background:#fff;
    }
    .pill label{font-size:12px; color:var(--muted)}
    .pill input, .pill select{
      border:none; outline:none; font-size:14px; background:transparent; min-height:24px;
    }
    .pill select{
      min-width:140px; appearance:none; padding-right:18px;
      background:linear-gradient(45deg,transparent 50%,var(--muted) 50%) right 8px center/8px 8px no-repeat;
    }
    .pill button{
      border:none; background:var(--blue); color:#fff; padding:8px 12px; border-radius:12px;
      font-weight:600; cursor:pointer
    }
    .pill button:active{opacity:.85}
    .pill:has(button){border:none;background:transparent;padding:0;}

    /* Meta ở bên phải hàng lọc */
    .meta{
      display:flex; gap:10px; align-items:center; color:var(--muted); font-size:13px;
      margin-left:auto;  /* đẩy sát phải */
    }
    .chip{background:#eef2ff; color:#1e40af; padding:4px 10px; border-radius:999px; font-weight:600}

    /* Bảng */
    .table-wrap{margin-top:12px}
    .table-wrapper{
      border:1px solid var(--line); border-radius:12px; overflow:auto; max-height: 100%; background:#fff;
    }
    table{width:100%; border-collapse:separate; border-spacing:0}
    th, td{padding:10px 12px; text-align:center; border-bottom:1px solid var(--line); font-size:14px}
    thead th{
      position:sticky; top:0; z-index:2; background:#fafafa; font-weight:700; color:#111;
      border-bottom:1px solid var(--line);
    }
    tfoot td{
      position:sticky; bottom:0; z-index:1; background:#fbfbfb; font-weight:700; border-top:1px solid var(--line);
    }
    tbody tr:hover{background:#fafafa}

    /* Checkbox iOS */
    .chk{appearance:none; width:18px; height:18px; border:2px solid #cbd5e1; border-radius:6px; cursor:pointer; position:relative}
    .chk:checked{border-color:var(--blue); background:var(--blue)}
    .chk:checked::after{content:""; position:absolute; left:4px; top:0px; width:6px; height:10px; border:2px solid #fff; border-top:none; border-left:none; transform:rotate(45deg)}

    /* Select trạng thái tô màu như badge */
    .tt-thanh-toan{
      border:none; border-radius:999px; padding:6px 12px; font-weight:600; cursor:pointer; text-align:center; appearance:none;
    }
    .tt-thanh-toan[value="chua"]{ background:#f1f5f9; color:#0f172a; }
    .tt-thanh-toan[value="da"]  { background:#ecfdf5; color:#065f46; }
    .tt-thanh-toan[value="dang"]{ background:#fffbeb; color:#92400e; }

    /* Nút thao tác */
    .btn-ghost{border:1px solid var(--line); background:#fff; padding:6px 10px; border-radius:10px; cursor:pointer}
    .btn-ghost:active{opacity:.85}
    .btn-icon{font-size:18px; line-height:0}
    .btn-danger{border-color:#fecaca; color:#b91c1c}

    .summary{margin-top:8px; display:flex; gap:8px; align-items:center; color:var(--muted); font-size:13px; padding-left:2px;}

    @media (max-width:900px){
      th:nth-child(5), td:nth-child(5){display:none;} /* Ẩn Mã KH trên màn hình nhỏ */
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Bộ lọc -->
    <div class="card">
      <div class="filters">
        <div class="pill">
          <label>Hành động</label>
          <select id="chonHanhDong">
            <option value="">— Chọn —</option>
            <option value="in">In hàng loạt</option>
            <option value="xoa">Xóa hóa đơn</option>
            <option value="thanhtoan">Thanh toán</option>
          </select>
        </div>
        <div class="pill">
          <label>Từ</label>
          <input type="date" id="tuNgay">
        </div>
        <div class="pill">
          <label>Đến</label>
          <input type="date" id="denNgay">
        </div>
        <div class="pill">
          <label>Mã KH</label>
          <input type="text" id="maKH" placeholder="Nhập mã KH...">
        </div>
        <div class="pill">
          <button id="btnLoc">🔍 Lọc</button>
        </div>

        <!-- Meta đếm -->
        <div class="meta">
          <span>Đã chọn:</span>
          <span class="chip" id="demChon">0</span>
          <span>| Tổng:</span>
          <span class="chip" id="tongTatCaTop">0 ₫</span>
        </div>
      </div>
    </div>

    <!-- Bảng -->
    <div class="table-wrap card" style="flex:1 1 auto; min-height:0; padding:8px">
      <div class="table-wrapper">
        <table id="bangHD">
          <thead>
            <tr>
              <th style="width:44px"><input id="chkAll" type="checkbox" class="chk"></th>
              <th style="min-width:120px">Số HĐ</th>
              <th style="min-width:200px">Ghi chú</th>
              <th style="min-width:120px">Ngày</th>
              <th style="min-width:100px">Mã KH</th>
              <th style="min-width:140px">Tổng tiền</th>
              <th style="min-width:160px">TT thanh toán</th>
              <th style="min-width:160px">Thanh toán</th>
              <th style="min-width:140px">Thao tác</th>
            </tr>
          </thead>
          <tbody></tbody>
          <tfoot>
            <tr>
              <td colspan="5" style="text-align:right">Tổng</td>
              <td id="tongTatCa">0 ₫</td>
              <td colspan="3"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <div class="summary">
      Gợi ý: Chọn nhiều hoá đơn → dùng “Hành động” để In/Xoá/Đánh dấu đã thanh toán.
    </div>
  </div>
  <link rel="stylesheet" href="/shared/mobile-fix.css">
  <script src="/shared/mobile-fix.js" defer></script>

  <script type="module">

import { supabase } from "./supabase.config.js"

const tbody = document.querySelector("#bangHD tbody")

const tuNgay = document.getElementById("tuNgay")
const denNgay = document.getElementById("denNgay")
const maKH = document.getElementById("maKH")

const demChon = document.getElementById("demChon")
const tongTatCa = document.getElementById("tongTatCa")
const tongTatCaTop = document.getElementById("tongTatCaTop")

const fmt = n => Number(n||0).toLocaleString("vi-VN")+" ₫"


async function loadPX(){

let query = supabase
.from("hoadon")
.select("*")
.like("thamchieu","XK%")
.order("ngay",{ascending:false})


if(tuNgay.value){
query = query.gte("ngay",tuNgay.value)
}

if(denNgay.value){
query = query.lte("ngay",denNgay.value)
}

if(maKH.value){
query = query.ilike("makh","%"+maKH.value+"%")
}

const { data } = await query

render(data||[])

}


function render(list){

tbody.innerHTML=""

let tong=0

list.forEach(hd=>{

tong += Number(hd.tongtien||0)

const tr=document.createElement("tr")

tr.innerHTML=`
<td>
<input type="checkbox" class="chk chkRow">
</td>

<td>${hd.thamchieu || ""}</td>

<td>${hd.ghichu || ""}</td>

<td>${new Date(hd.ngay).toLocaleDateString("vi-VN")}</td>

<td>${hd.makh || ""}</td>

<td>${fmt(hd.tongtien)}</td>

<td>
<select class="tt-thanh-toan" value="${hd.tinhtrang||'chua'}">
<option value="chua">Chưa</option>
<option value="dang">Đang</option>
<option value="da">Đã</option>
</select>
</td>

<td>${fmt(hd.thanhtoan||0)}</td>

<td>

<button class="btn-ghost btn-icon" data-sohd="${hd.sohd}">
🖨
</button>

</td>
`

tbody.appendChild(tr)

})


tongTatCa.textContent = fmt(tong)
tongTatCaTop.textContent = fmt(tong)

ganSuKien()

}


function ganSuKien(){

document.querySelectorAll(".btn-icon").forEach(btn=>{

btn.onclick=()=>{

const sohd = btn.dataset.sohd

window.open(
`xuatkho.html?sohd=${encodeURIComponent(sohd)}`,
"_blank",
"width=900,height=700"
)

}

})


document.querySelectorAll(".chkRow").forEach(chk=>{
chk.onchange = capNhatDem
})

}


function capNhatDem(){

const checked = document.querySelectorAll(".chkRow:checked")

demChon.textContent = checked.length

}


/* ===== chọn tất cả ===== */

document.getElementById("chkAll").onchange = e=>{

const checked = e.target.checked

document.querySelectorAll(".chkRow").forEach(c=>{
c.checked = checked
})

capNhatDem()

}


/* ===== lọc ===== */

document.getElementById("btnLoc").onclick = loadPX


/* ===== load lần đầu ===== */

loadPX()

</script>
</body>
</html>
