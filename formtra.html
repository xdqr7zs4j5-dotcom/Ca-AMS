<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Trả hàng</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#f5f5f7; --card:#fff; --text:#111; --muted:#6b7280; --line:#e5e7eb;
      --blue:#007aff; --red:#ff3b30; --radius:12px; --shadow:0 6px 24px rgba(0,0,0,.06);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;padding:16px;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
    h2{margin:0 0 12px 0}

    .bar{ display:flex; gap:8px; align-items:center; margin:8px 0 12px; }
    button{
      padding:8px 14px; border:1px solid var(--line); background:#fff; border-radius:10px;
      cursor:pointer; box-shadow:var(--shadow);
    }
    button.primary{border-color:#dbeafe}
    button:active{transform:translateY(1px)}
    .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}

    /* >>> Bố cục chiếm hết chiều cao còn lại */
    .page{
      display:flex;
      flex-direction:column;
      min-height:calc(100vh - 32px); /* trừ padding body 16px trên + dưới */
      gap:8px;
    }
    .table-wrap{
      flex:1;          /* chiếm phần còn lại */
      min-height:0;    /* cho phép cuộn bên trong */
      overflow:auto;
      border-radius:var(--radius);
    }

    table{width:100%; border-collapse:collapse; font-size:14px}
    th,td{border-bottom:1px solid #eee; padding:8px; text-align:center}
    thead th{position:sticky; top:0; background:#fafafa; z-index:1; border-bottom:1px solid #e5e7eb}
    tbody tr:nth-child(even){background:#fcfcfd}
    td:nth-child(10), th:nth-child(10){text-align:right}
    td input[type="number"]{width:90px; text-align:center}
    td input[type="text"]{width:220px}
    .muted{color:var(--muted)}
    .warning{color:#c00; text-align:center; padding:12px}
    .right{text-align:right}
    .left{text-align:left}
    .center{text-align:center}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;box-shadow:var(--shadow);font-size:13px}
  </style>
</head>
<body>
  <div class="page">
    <h2>Trả hàng</h2>

    <div class="bar">
      <span class="chip">HĐ đã chọn: <strong id="demHD" style="margin-left:4px">0</strong></span>
      <button id="themDongBtn" type="button">➕ Thêm dòng</button>
      <button id="tiepTheoBtn" class="primary" type="button">➡ Tiếp theo</button>
      <span class="muted" id="hint">Nhập URL dạng <code>?sohdlist=[%22PX001%22,%22PX002%22]</code></span>
    </div>

    <div class="card table-wrap">
      <table id="bangHangTra">
        <thead>
          <tr>
            <th><input type="checkbox" id="chonTatCa" /></th>
            <th>STT</th>
            <th>Số HĐ</th>
            <th>Ngày</th>
            <th>Mã KH</th>
            <th class="left">Tên SP</th>
            <th>Tổng SL</th>
            <th>ĐVT</th>
            <th>Đơn giá</th>
            <th>Thành tiền</th>
            <th>Ghi chú</th>
            <th>Mã SP</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Datalist sản phẩm để tự động gợi ý -->
    <datalist id="dsSanPham"></datalist>
  </div>
  <link rel="stylesheet" href="/shared/mobile-fix.css">
  <script src="/shared/mobile-fix.js" defer></script>

  <script type="module">
    import { supabase } from "./supabase.config.js";

    // ====== DOM refs ======
    const tbody        = document.querySelector("#bangHangTra tbody");
    const chonTatCaEl  = document.getElementById("chonTatCa");
    const btnThemDong  = document.getElementById("themDongBtn");
    const btnTiepTheo  = document.getElementById("tiepTheoBtn");
    const dlSanPham    = document.getElementById("dsSanPham");
    const demHDEl      = document.getElementById("demHD");

    // ====== State ======
    const mapSoHDToSTT = {};     // sohd -> STT nhóm
    const hdBySohd     = new Map(); // sohd -> hoadon row
    let stt = 1;
    let danhSachSoHD = [];       // lưu ra global để Thêm dòng dùng
    let spList = [];             // list sản phẩm: {tensp, masp, dvt, dongia}
    const spMap = new Map();     // tensp -> record

    // ====== Utils ======
    const D = {
      fmtInt: (n) => (Number(n)||0).toLocaleString("vi-VN"),
      toNum : (v) => Number(v) || 0,
      today : () => new Date().toISOString().slice(0,10)
    };

    async function taoSoPhieuTraMoi(prefix = "TR", soChuSo = 3) {
      const { data, error } = await supabase
        .from("hoadon")
        .select("sohd")
        .eq("phanloai", "kh")
        .ilike("sohd", `${prefix}%`);
      if (error) throw error;

      let maxNum = 0;
      for (const row of (data || [])) {
        const m = String(row.sohd).match(/\d+$/);
        if (!m) continue;
        const n = parseInt(m[0], 10);
        if (n > maxNum) maxNum = n;
      }
      return prefix + String(maxNum + 1).padStart(soChuSo, "0");
    }

    async function capNhatHDGocCoHangTra(sohdGoc, maPhieuTra) {
      const { data, error } = await supabase
        .from("hoadon")
        .select("thamchieu, ghichu")
        .eq("sohd", sohdGoc)
        .single();
      if (error) throw error;

      const list = (data?.thamchieu || "")
        .split(",").map(s => s.trim()).filter(Boolean);
      if (!list.includes(maPhieuTra)) list.push(maPhieuTra);
      const newThamChieu = list.join(", ");

      let newGhiChu = data?.ghichu || "";
      if (!/có hàng trả/i.test(newGhiChu)) {
        newGhiChu = newGhiChu ? (newGhiChu + " | Có hàng trả") : "Có hàng trả";
      }

      const { error: upErr } = await supabase
        .from("hoadon")
        .update({ thamchieu: newThamChieu, ghichu: newGhiChu })
        .eq("sohd", sohdGoc);
      if (upErr) throw upErr;
    }

    function capNhatDatasetVaTT(chk, { ipSL, ipDG, tdTT }) {
      const sl = D.toNum(ipSL.value);
      const dg = D.toNum(ipDG.value);
      chk.dataset.soluong = String(sl);
      chk.dataset.dongia  = String(dg);
      tdTT.textContent    = D.fmtInt(sl * dg);
    }

    function addTextCell(tr, text="", cls="", align="center") {
      const td = document.createElement("td");
      td.textContent = text ?? "";
      if (cls) td.className = cls;
      td.style.textAlign = align;
      tr.appendChild(td);
      return td;
    }

    function addInputCell(tr, {type="text", value="", width, align="center", placeholder=""} = {}) {
      const td = document.createElement("td");
      const ip = document.createElement("input");
      ip.type = type;
      ip.value = value;
      if (placeholder) ip.placeholder = placeholder;
      if (width) ip.style.width = width;
      ip.style.textAlign = align;
      td.appendChild(ip);
      tr.appendChild(td);
      return { td, ip };
    }

    function napDatalistSanPham(list) {
      dlSanPham.innerHTML = "";
      list.forEach(sp => {
        const opt = document.createElement("option");
        opt.value = sp.tensp || "";
        opt.label = `${sp.masp || ""} · ${sp.dvt || ""} · ${D.fmtInt(sp.dongia||0)}`;
        dlSanPham.appendChild(opt);
      });
    }

    // ====== Load ban đầu ======
    window.addEventListener("DOMContentLoaded", async () => {
      try {
        // 0) Lấy danh sách số HĐ từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const listStr = urlParams.get("sohdlist");
        danhSachSoHD = listStr ? JSON.parse(decodeURIComponent(listStr)) : [];
        demHDEl.textContent = String(danhSachSoHD.length);

        if (!Array.isArray(danhSachSoHD) || !danhSachSoHD.length) {
          tbody.innerHTML = `<tr><td colspan="12" class="warning">⚠ Không có hóa đơn nào được chọn.</td></tr>`;
          return;
        }

        // 1) Nạp từng HĐ + chi tiết
        for (const sohd of danhSachSoHD) {
          if (!(sohd in mapSoHDToSTT)) mapSoHDToSTT[sohd] = stt++;
          const sttNhom = mapSoHDToSTT[sohd];

          const { data: hd, error: errHD } = await supabase
            .from("hoadon").select("*").eq("sohd", sohd).single();
          if (errHD || !hd) { console.error("Lỗi hoadon", sohd, errHD); continue; }
          hdBySohd.set(sohd, hd);

          const { data: chiTiet, error: errCT } = await supabase
            .from("chitiet").select("*").eq("sohd", sohd);
          if (errCT) { console.error("Lỗi chitiet", sohd, errCT); continue; }

          for (const sp of chiTiet) {
            const slNum = D.toNum(sp.soluong);
            const dgNum = D.toNum(sp.dongia);

            const tr = document.createElement("tr");

            // Checkbox + dataset
            const tdChk = document.createElement("td");
            const chk = document.createElement("input");
            chk.type = "checkbox";
            chk.className = "chonDong";
            chk.dataset.sohd    = sohd;
            chk.dataset.ngay    = hd.ngay || "";
            chk.dataset.makh    = hd.makh || "";
            chk.dataset.tensp   = sp.tensp || "";
            chk.dataset.soluong = String(slNum);
            chk.dataset.dvt     = sp.dvt || "";
            chk.dataset.dongia  = String(dgNum);
            chk.dataset.ghichu  = sp.ghichu || "";
            chk.dataset.masp    = sp.masp || "";
            tdChk.appendChild(chk);
            tr.appendChild(tdChk);

            addTextCell(tr, sttNhom);
            addTextCell(tr, sohd);
            addTextCell(tr, hd.ngay || "");
            addTextCell(tr, hd.makh || "");
            addTextCell(tr, sp.tensp || "", "left", "left");

            // Tổng SL (editable)
            const { ip: ipSL } = addInputCell(tr, { type:"number", value: String(slNum), width:"80px" });

            // ĐVT
            const tdDVT = addTextCell(tr, sp.dvt || "");

            // Đơn giá (text hiển thị)
            const tdDG = addTextCell(tr, D.fmtInt(dgNum), "", "right");

            // Thành tiền
            const tdTT = addTextCell(tr, D.fmtInt(slNum * dgNum), "", "right");

            // Ghi chú
            const { ip: ipGC } = addInputCell(tr, { type:"text", value: sp.ghichu || "", width:"180px", align:"left" });

            // Mã SP
            const tdMaSP = addTextCell(tr, sp.masp || "");

            // Sự kiện: sửa SL -> update dataset + TT
            ipSL.addEventListener("input", () => {
              const newSL = D.toNum(ipSL.value);
              chk.dataset.soluong = String(newSL);
              tdTT.textContent = D.fmtInt(newSL * dgNum);
            });

            // Sự kiện: ghi chú -> dataset
            ipGC.addEventListener("input", () => {
              chk.dataset.ghichu = ipGC.value || "";
            });

            tbody.appendChild(tr);
          }
        }

        // 2) Chọn tất cả
        chonTatCaEl?.addEventListener("change", e => {
          document.querySelectorAll(".chonDong").forEach(c => c.checked = e.target.checked);
        });

        // 3) Nạp danh sách sản phẩm cho datalist
        try {
          const { data: dsSP, error: errSP } = await supabase
            .from("sanpham")
            .select("tensp, masp, dvt, dongia");
          if (errSP) throw errSP;
          spList = dsSP || [];
          spMap.clear();
          spList.forEach(sp => spMap.set((sp.tensp||"").trim(), sp));
          napDatalistSanPham(spList);
        } catch(e) {
          console.error("Lỗi nạp sản phẩm:", e);
        }

      } catch (e) {
        console.error("Lỗi nạp dữ liệu:", e);
        tbody.innerHTML = `<tr><td colspan="12" class="warning">❌ Lỗi nạp dữ liệu.</td></tr>`;
      }
    });

    // ====== Thêm dòng thủ công ======
    btnThemDong.addEventListener("click", () => {
      if (!danhSachSoHD.length) {
        alert("Chưa có hóa đơn gốc để gắn dòng trả.");
        return;
      }
      const sohdGoc = prompt(`Gắn dòng trả vào SỐ HĐ nào?\n${danhSachSoHD.join(", ")}`, danhSachSoHD[0]);
      if (!sohdGoc || !hdBySohd.has(sohdGoc)) return alert("Số HĐ không hợp lệ.");

      const hdGoc = hdBySohd.get(sohdGoc);
      const sttNhom = mapSoHDToSTT[sohdGoc] ?? (mapSoHDToSTT[sohdGoc] = stt++);

      const tr = document.createElement("tr");

      // Checkbox + dataset mặc định
      const tdChk = document.createElement("td");
      const chk = document.createElement("input");
      chk.type = "checkbox"; chk.className = "chonDong"; chk.checked = true;
      chk.dataset.sohd    = sohdGoc;
      chk.dataset.ngay    = hdGoc?.ngay || "";
      chk.dataset.makh    = hdGoc?.makh || "";
      chk.dataset.tensp   = "";
      chk.dataset.soluong = "1";
      chk.dataset.dvt     = "";
      chk.dataset.dongia  = "0";
      chk.dataset.ghichu  = "";
      chk.dataset.masp    = "";
      tdChk.appendChild(chk);
      tr.appendChild(tdChk);

      addTextCell(tr, sttNhom);
      addTextCell(tr, sohdGoc);
      addTextCell(tr, hdGoc?.ngay || "");
      addTextCell(tr, hdGoc?.makh || "");

      // Tên SP (input + datalist)
      const tdTen = document.createElement("td");
      const ipTen = document.createElement("input");
      ipTen.type = "text";
      ipTen.setAttribute("list", "dsSanPham");
      ipTen.placeholder = "Chọn/nhập sản phẩm…";
      ipTen.style.width = "220px";
      tdTen.appendChild(ipTen);
      tr.appendChild(tdTen);

      // Tổng SL
      const { ip: ipSL } = addInputCell(tr, { type:"number", value:"1", width:"80px" });

      // ĐVT
      const tdDVT = addTextCell(tr, "");

      // Đơn giá (editable)
      const { ip: ipDG } = addInputCell(tr, { type:"number", value:"0", width:"110px", align:"right" });

      // Thành tiền (calc)
      const tdTT = addTextCell(tr, "0", "", "right");

      // Ghi chú
      const { ip: ipGC } = addInputCell(tr, { type:"text", value:"", width:"180px", align:"left", placeholder:"Ghi chú (tuỳ chọn)" });

      // Mã SP
      const tdMaSP = addTextCell(tr, "");

      // Chọn tên SP -> tự điền
      ipTen.addEventListener("change", () => {
        const key = (ipTen.value || "").trim();
        const sp  = spMap.get(key);
        chk.dataset.tensp = key;
        if (sp) {
          tdDVT.textContent = sp.dvt || "";
          tdMaSP.textContent = sp.masp || "";
          ipDG.value = String(D.toNum(sp.dongia));
          chk.dataset.dvt  = sp.dvt || "";
          chk.dataset.masp = sp.masp || "";
        } else {
          tdDVT.textContent = "";
          tdMaSP.textContent = "";
          ipDG.value = "0";
          chk.dataset.dvt  = "";
          chk.dataset.masp = "";
        }
        capNhatDatasetVaTT(chk, { ipSL, ipDG, tdTT });
      });

      // SL/ĐG thay đổi -> tính tiền
      ipSL.addEventListener("input", () => capNhatDatasetVaTT(chk, { ipSL, ipDG, tdTT }));
      ipDG.addEventListener("input", () => capNhatDatasetVaTT(chk, { ipSL, ipDG, tdTT }));

      // Ghi chú -> dataset
      ipGC.addEventListener("input", () => { chk.dataset.ghichu = ipGC.value || ""; });

      // Tính lần đầu
      capNhatDatasetVaTT(chk, { ipSL, ipDG, tdTT });

      tbody.appendChild(tr);
    });

    // ====== Ghi phiếu trả hàng loạt ======
    btnTiepTheo.addEventListener("click", async () => {
      const chon = [...document.querySelectorAll(".chonDong:checked")];
      if (!chon.length) return alert("Chọn ít nhất 1 dòng khách trả.");

      // Build rows data từ dataset
      const rows = chon.map(c => ({
        sohd_goc: c.dataset.sohd,
        ngay_goc: c.dataset.ngay || null,
        makh: c.dataset.makh || "",
        tensp: c.dataset.tensp || "",
        soluong: D.toNum(c.dataset.soluong),
        dvt: c.dataset.dvt || "",
        dongia: D.toNum(c.dataset.dongia),
        ghichu: c.dataset.ghichu || "",
        masp: c.dataset.masp || ""
      }));

      // Gom theo SỐ HĐ gốc
      const bySohd = new Map();
      for (const r of rows) {
        if (!bySohd.has(r.sohd_goc)) bySohd.set(r.sohd_goc, []);
        bySohd.get(r.sohd_goc).push(r);
      }

      // Ngày trả dùng chung (cho đơn giản)
      const ngayTra = prompt("Nhập NGÀY trả (YYYY-MM-DD):", D.today());
      if (!ngayTra) return;

      const ketQua = [];
      try {
        for (const [sohdGoc, items] of bySohd.entries()) {
          // Validate KH theo nhóm
          const makhSet = Array.from(new Set(items.map(i => i.makh)));
          if (makhSet.length !== 1) throw new Error(`Nhóm ${sohdGoc} có nhiều Mã KH.`);
          const makh = makhSet[0];

          // Tổng tiền âm
          const tongAbs = items.reduce((s, i) => s + (D.toNum(i.soluong) * D.toNum(i.dongia)), 0);
          const tongtien = -Math.abs(tongAbs);
          const chietkhau = 0, thue = 0;
          const tongthanhtoan = tongtien;

          // Tạo mã phiếu trả + insert HOADON (retry khi trùng)
          let soPhieu = await taoSoPhieuTraMoi("TR", 3);
          const hdInsert = {
            sohd: soPhieu,
            ngay: ngayTra,
            makh,
            tongtien,
            chietkhau,
            thue,
            tongthanhtoan,
            phanloai: "kh",
            phathanh: false,
            thamchieu: sohdGoc,
            ghichu: `Hàng trả từ: ${sohdGoc}`
          };

          let tryCount = 0, inserted = false;
          while (!inserted && tryCount < 3) {
            const { error: errHD } = await supabase.from("hoadon").insert(hdInsert);
            if (errHD && /duplicate|already exists|unique/i.test(errHD?.message || "")) {
              soPhieu = await taoSoPhieuTraMoi("TR", 3);
              hdInsert.sohd = soPhieu;
              tryCount++;
              continue;
            }
            if (errHD) throw errHD;
            inserted = true;
          }

          // Insert CHITIET (số âm)
          const ctInsert = items.map(i => {
            const sl = Math.abs(D.toNum(i.soluong));
            const dg = D.toNum(i.dongia);
            return {
              sohd: soPhieu,
              ngay: ngayTra,
              makh,
              tensp: (i.tensp||"").trim() || null,
              soluong: -sl,
              dvt: (i.dvt||"").trim() || null,
              dongia: dg,
              thanhtien: -(sl * dg),
              ghichu: (i.ghichu ? i.ghichu + " | " : "") + "Hàng trả",
              masp: (i.masp||"").trim() || null
            };
          });

          const { error: errCT } = await supabase
            .from("chitiet")
            .insert(ctInsert, { returning: "minimal" });
          if (errCT) {
            console.error("❌ Lỗi insert chitiet:", errCT);
            await supabase.from("hoadon").delete().eq("sohd", soPhieu); // rollback HĐ
            throw new Error("Insert chitiet thất bại: " + (errCT.message || JSON.stringify(errCT)));
          }

          // Cập nhật HĐ gốc
          await capNhatHDGocCoHangTra(sohdGoc, soPhieu);

          ketQua.push({ sohdTra: soPhieu, sohdGoc, makh, tong: Math.abs(tongthanhtoan) });
        }

        const msg = ketQua
          .map(k => `• ${k.sohdTra} (từ ${k.sohdGoc}) — ${D.fmtInt(k.tong)}`)
          .join("\n");
        alert("✅ Đã ghi các phiếu trả:\n" + msg);

        // đóng/quay lại
        if (window.opener && !window.opener.closed) {
          window.close();
        } else if (history.length > 1) {
          history.back();
        } else if (document.referrer) {
          location.href = document.referrer;
        } else {
          location.href = "/";
        }
      } catch (e) {
        console.error(e);
        alert("❌ Lỗi ghi phiếu trả: " + (e?.message || e));
      }
    });
  </script>
</body>
</html>
