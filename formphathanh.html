<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Phát hành</title>

<!-- XLSX (global) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>

<style>
  :root{
    --bg:#f5f5f7; --card:#fff; --text:#111; --muted:#6b7280; --line:#e5e7eb;
    --blue:#007aff; --radius:14px; --shadow:0 6px 24px rgba(0,0,0,.06);
    --toolbarH:64px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    overflow:hidden; /* cố định trang tại màn hình; chỉ khung bảng cuộn */
  }

  /* Toolbar cố định trên cùng */
  .toolbar{
    position:fixed; top:0; left:0; right:0; height:var(--toolbarH);
    backdrop-filter:saturate(180%) blur(8px);
    background:rgba(255,255,255,.9); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; padding:0 16px; z-index:50;
  }
  .toolbar h2{margin:0; font-size:18px}
  .spacer{flex:1}
  .btn{
    height:36px; padding:0 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--blue); color:#fff; font-weight:600; cursor:pointer;
  }

  /* Khung bảng có thanh cuộn */
  .wrap{
    position:fixed; top:var(--toolbarH); left:0; right:0; bottom:0;
    padding:16px;
  }
  .card{
    height:100%; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow);
    display:flex; flex-direction:column;
  }
  .table-wrap{
    overflow:auto; /* cuộn ngang + dọc */
    padding:12px;
    height:100%;
  }

  table{ border-collapse:separate; border-spacing:0; min-width:1200px; width:100% }
  thead th, tbody td{
    border-bottom:1px solid var(--line);
    padding:8px 10px; font-size:14px; text-align:left; white-space:nowrap;
  }
  thead th{
    position:sticky; top:0; z-index:1;
    background:#fff; box-shadow:0 1px 0 var(--line);
  }
  tbody tr:hover{ background:#fafafa }

  /* Căn phải cột số */
  .num{ text-align:right }

  .warning{ color:#b91c1c; padding:12px; }
</style>
</head>
<body>

<!-- Thanh công cụ trên cùng -->
<div class="toolbar">
  <h2>📤 Phát hành hóa đơn</h2>
  <div class="spacer"></div>
  <button id="tiepTheoBtn" class="btn">➡ Tiếp theo (Xuất Excel)</button>
</div>

<!-- Khung bảng cuộn -->
<div class="wrap">
  <div class="card">
    <div class="table-wrap">
      <table id="bangPhatHanh">
        <thead>
          <tr>
            <th><input type="checkbox" id="chonTatCa"></th>
            <th>STT</th>
            <th>Ngày</th>
            <th>Mã KH</th>
            <th>Tên đơn vị</th>
            <th>MST</th>
            <th>Địa chỉ</th>
            <th>Người mua hàng</th>
            <th>Email</th>
            <th>HT thanh toán</th>
            <th>Tên sản phẩm</th>
            <th>ĐVT</th>
            <th class="num">Số lượng</th>
            <th class="num">Đơn giá</th>
            <th class="num">Thành tiền</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div id="emptyNote" class="warning" style="display:none"></div>
    </div>
  </div>
</div>
<link rel="stylesheet" href="/shared/mobile-fix.css">
<script src="/shared/mobile-fix.js" defer></script>
<script type="module">
  import { supabase } from "./supabase.config.js";

  // ===== Helpers =====
  function fmtDateDMY(d) {
    if (!d) return "";
    const s = String(d);
    if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) {
      const [dd, mm, yyyy] = s.split("/");
      return `${parseInt(dd,10)}/${parseInt(mm,10)}/${yyyy}`;
    }
    const dt = new Date(d);
    if (isNaN(dt)) return "";
    return `${dt.getDate()}/${dt.getMonth()+1}/${dt.getFullYear()}`;
  }

  const urlParams = new URLSearchParams(window.location.search);
  const danhSachSoHD = JSON.parse(decodeURIComponent(urlParams.get("sohdlist") || "[]"));
  const tbody = document.querySelector("#bangPhatHanh tbody");
  const emptyNote = document.getElementById("emptyNote");

  let stt = 1;
  const mapSoHDToSTT = {};

  window.addEventListener("DOMContentLoaded", async () => {
    if (!danhSachSoHD.length) {
      emptyNote.style.display = "block";
      emptyNote.textContent = "⚠ Không có hóa đơn nào được chọn.";
      return;
    }

    for (const sohd of danhSachSoHD) {
      if (!(sohd in mapSoHDToSTT)) mapSoHDToSTT[sohd] = stt++;

      const { data: hd } = await supabase.from("hoadon").select("*").eq("sohd", sohd).single();
      if (!hd) continue;

      const { data: kh } = await supabase.from("khachhang").select("*").eq("makh", hd.makh).single();
      const { data: chitiet } = await supabase.from("chitiet").select("*").eq("sohd", sohd);

      const ngayDMY = fmtDateDMY(hd.ngay);
      const htttVal = hd.httt && hd.httt.trim() ? hd.httt : "Chuyển khoản / Tiền mặt";

      for (const sp of (chitiet || [])) {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><input type="checkbox" class="chonDong"
              data-sohd="${sohd}"
              data-ngay="${ngayDMY}"
              data-makh="${hd.makh || ""}"
              data-tenkh="${kh?.tendv || ""}"
              data-diachi="${kh?.diachi || ""}"
              data-mst="${kh?.mst || ""}"
              data-nguoimua="${kh?.tenkh || ""}"
              data-email="${kh?.email || ""}"
              data-httt="${htttVal}"
              data-tensp="${sp.tensp}"
              data-dvt="${sp.dvt || ""}"
              data-soluong="${sp.soluong ?? 0}"
              data-dongia="${sp.dongia ?? 0}"
          ></td>
          <td>${mapSoHDToSTT[sohd]}</td>
          <td>${ngayDMY}</td>
          <td>${hd.makh || ""}</td>
          <td>${kh?.tendv || ""}</td>
          <td>${kh?.mst || ""}</td>
          <td>${kh?.diachi || ""}</td>  
          <td>${kh?.tenkh || ""}</td>
          <td>${kh?.email || ""}</td>
          <td>${htttVal}</td>
          <td>${sp.tensp}</td>
          <td>${sp.dvt || ""}</td>
          <td class="num">${sp.soluong ?? 0}</td>
          <td class="num">${sp.dongia ?? 0}</td>
          <td class="num">${(sp.soluong ?? 0) * (sp.dongia ?? 0)}</td>
        `;
        tbody.appendChild(row);
      }
    }
  });

  // ===== Nút Tiếp theo (xuất Excel) =====
  document.getElementById("tiepTheoBtn").addEventListener("click", () => {
    const chon = [...document.querySelectorAll(".chonDong:checked")];
    if (!chon.length) return alert("Vui lòng chọn ít nhất 1 dòng để phát hành.");

    const duLieu = chon.map(cb => {
      const dt = cb.dataset;
      const soluong = Number(dt.soluong ?? 0);
      const dongia  = Number(dt.dongia  ?? 0);
      const htttVal = dt.httt && dt.httt.trim() ? dt.httt : "Chuyển khoản / Tiền mặt";

      return {
        sohd: dt.sohd,                 // dùng để nhóm STT
        ngay: dt.ngay,                 // chuỗi dd/m/yyyy
        makh: dt.makh || "",
        tenkh: dt.tenkh || "",
        diachi: dt.diachi || "",
        mst: dt.mst   || "",
        nguoimua: dt.nguoimua || "",
        email: dt.email || "",
        httt: htttVal,
        tensp: dt.tensp,
        dvt: dt.dvt || "",
        soluong,
        dongia,
        thanhtien: soluong * dongia
      };
    });

    xuatExcel(duLieu);
  });

  // ===== Chọn tất cả =====
  document.getElementById("chonTatCa").addEventListener("change", function () {
    const daChon = this.checked;
    document.querySelectorAll(".chonDong").forEach(cb => { cb.checked = daChon; });
  });

  // ===== Xuất Excel (headers theo yêu cầu) =====
  function xuatExcel(danhSach) {
  const ws = XLSX.utils.aoa_to_sheet([]);
  const emptyRows = Array.from({ length: 7 }, () => []);
  XLSX.utils.sheet_add_aoa(ws, emptyRows, { origin: "A1" });

  const headers = [
    "STT", "Ngày", "Mã KH", "Tên đơn vị", "MST", "Địa chỉ",
    "Người mua hàng", "Email", "HT thanh toán",
    "Tên SP", "ĐVT", "SL", "Đơn giá", "Thành tiền"
  ];
  XLSX.utils.sheet_add_aoa(ws, [headers], { origin: "A8" });

  const sttMap = {};
  let stt = 1;
  const rows = [];

  for (const item of danhSach) {
    const sohd = item.sohd;
    const isFirstRow = !(sohd in sttMap);
    if (isFirstRow) sttMap[sohd] = stt++;

    // chỉ ghi đầy đủ ở dòng đầu tiên
    const ngay      = isFirstRow ? (item.ngay || "")       : "";
    const makh      = isFirstRow ? (item.makh || "")       : "";
    const tendv     = isFirstRow ? (item.tenkh || "")      : "";
    const mst       = isFirstRow ? (item.mst  || "")       : "";
    const diachi    = isFirstRow ? (item.diachi || "")     : "";
    const tenkh     = isFirstRow ? (item.nguoimua || "")   : "";
    const email     = isFirstRow ? (item.email || "")      : "";
    const httt      = isFirstRow ? (item.httt || "")       : "";

    rows.push([
      sttMap[sohd],  // STT
      ngay,
      makh,
      tendv,
      mst,
      diachi,
      tenkh,
      email,
      httt,
      item.tensp,
      item.dvt,
      item.soluong,
      item.dongia,
      item.thanhtien
    ]);
  }

  XLSX.utils.sheet_add_aoa(ws, rows, { origin: "A9" });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "PhatHanh");
  XLSX.writeFile(wb, `phathanh_${Date.now()}.xlsx`);

  const sohdList = [...new Set(danhSach.map(d => d.sohd))];
  if (window.opener) {
    window.opener.postMessage({ type: "phathanh-done", dsSoHD: sohdList }, "*");
  }
  window.close();
}

</script>
</body>
</html>
