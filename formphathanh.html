<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Phát hành (Excel chuẩn MISA)</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#f5f5f7; --card:#fff; --line:#e5e7eb; --blue:#007aff;
}
body{
  margin:0;background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
}
.toolbar{
  position:fixed;top:0;left:0;right:0;height:60px;
  background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 16px;z-index:10;
}
.btn{
  background:var(--blue);color:#fff;border:none;
  padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;
}
.wrap{margin-top:70px;padding:16px;}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;}
.table-wrap{overflow:auto;max-height:80vh;}
table{border-collapse:collapse;width:1800px;font-size:13px;}
th,td{border:1px solid var(--line);padding:6px 8px;white-space:nowrap;}
thead th{background:#fafafa;position:sticky;top:0;}
.num{text-align:right;}
</style>
</head>

<body>

<div class="toolbar">
  <h3>📤 Phát hành (chuẩn Excel MISA)</h3>
  <div style="flex:1"></div>
  <button id="exportBtn" class="btn">Xuất Excel</button>
</div>

<div class="wrap">
  <div class="card">
    <div class="table-wrap">
      <table id="bang">
        <thead>
          <tr>
            <th><input type="checkbox" id="all"></th>
            <th>Hình thức bán hàng</th>
            <th>Phương thức thanh toán</th>
            <th>Kèm PXK</th>
            <th>Lập kèm HĐ</th>
            <th>HĐ máy tính tiền</th>
            <th>Đã lập HĐ</th>
            <th>Ngày hạch toán</th>
            <th>Ngày chứng từ</th>
            <th>Số chứng từ</th>
            <th>Số PX</th>
            <th>Mã KH</th>
            <th>Tên khách hàng</th>
            <th>Địa chỉ</th>
            <th>MST</th>
            <th>Tên hàng</th>
            <th>Tiền/CP</th>
            <th>TK DT</th>
            <th>ĐVT</th>
            <th class="num">SL</th>
            <th class="num">Đơn giá</th>
            <th class="num">Thành tiền</th>
            <th>Mã kho</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script type="module">
import { supabase } from "./supabase.config.js";

const params = new URLSearchParams(location.search);
const dsSoHD = JSON.parse(decodeURIComponent(params.get("sohdlist") || "[]"));
const tbody = document.querySelector("#bang tbody");

function dmy(d){
  const dt = new Date(d);
  return dt.getDate()+"/"+(dt.getMonth()+1)+"/"+dt.getFullYear();
}

for (const sohd of dsSoHD) {
  const { data: hd } = await supabase.from("hoadon").select("*").eq("sohd", sohd).single();
  const { data: kh } = await supabase.from("khachhang").select("*").eq("makh", hd.makh).single();
  const { data: ct } = await supabase.from("chitiet").select("*").eq("sohd", sohd);

  for (const sp of ct) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><input type="checkbox" class="row"></td>
      <td>Bán hàng hóa trong nước</td>
      <td>${hd.httt || "Chưa thu tiền"}</td>
      <td>Không</td>
      <td>Không</td>
      <td>Không</td>
      <td>Chưa lập</td>
      <td>${dmy(hd.ngay)}</td>
      <td>${dmy(hd.ngay)}</td>
      <td>${sohd}</td>
      <td>XK${sohd}</td>
      <td>${hd.makh || ""}</td>
      <td>${kh?.tendv || ""}</td>
      <td>${kh?.diachi || ""}</td>
      <td>${kh?.mst || ""}</td>
      <td>${sp.tensp}</td>
      <td>131</td>
      <td>5111</td>
      <td>${sp.dvt || ""}</td>
      <td class="num">${sp.soluong}</td>
      <td class="num">${sp.dongia}</td>
      <td class="num">${sp.soluong * sp.dongia}</td>
      <td>BK-NS</td>
    `;
    tbody.appendChild(tr);
  }
}

/* chọn tất cả */
document.getElementById("all").onchange = e=>{
  document.querySelectorAll(".row").forEach(r=>r.checked=e.target.checked);
};

/* xuất excel */
document.getElementById("exportBtn").onclick = ()=>{
  const rows = [...document.querySelectorAll(".row:checked")].map(r =>
    [...r.closest("tr").children].slice(1).map(td=>td.innerText)
  );
  if (!rows.length) return alert("Chưa chọn dòng");

  const headers = [...document.querySelectorAll("thead th")].slice(1).map(th=>th.innerText);
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Import");
  XLSX.writeFile(wb, "import_misa.xlsx");
};
</script>

</body>
</html>
