<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phiếu Xuất Kho</title>

<style>

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#f5f5f7;
margin:0;
padding:20px;
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:14px;
padding:16px;
margin-bottom:16px;
}

h2{
margin:0 0 10px 0;
}

.row{
display:flex;
gap:10px;
align-items:center;
}

button{
padding:10px 14px;
border:none;
border-radius:10px;
font-weight:600;
cursor:pointer;
}

.btn-blue{
background:#007aff;
color:white;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border-bottom:1px solid #eee;
padding:8px;
text-align:left;
}

thead{
background:#fafafa;
}

input{
border:none;
outline:none;
width:100%;
background:transparent;
}

</style>
</head>

<body>

<div class="card">

<h2>Phiếu Xuất Kho</h2>

<div class="row">

<label>Số HĐ</label>
<input id="sohd" style="width:140px">

<button class="btn-blue" id="btnLoad">Load</button>

<button class="btn-blue" id="btnXuat">Xuất kho</button>

</div>

</div>


<div class="card">

<table>

<thead>
<tr>
<th>STT</th>
<th>Mã SP</th>
<th>Tên SP</th>
<th>SL đặt</th>
<th>SL giao</th>
<th>ĐVT</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

</div>


<script type="module">

import { supabase } from "./supabase.config.js";

const qs = new URLSearchParams(location.search);

document.getElementById("btnLoad")
.addEventListener("click", loadHoaDon);

document.getElementById("btnXuat")
.addEventListener("click", xuatKho);


async function loadHoaDon(){

const sohd =
document.getElementById("sohd").value ||
qs.get("sohd");

if(!sohd){
alert("Thiếu số hóa đơn");
return;
}

const { data: chitiet, error } =
await supabase
.from("chitiet")
.select("*")
.eq("sohd", sohd)
.order("masp",{ascending:true});

if(error || !chitiet){
alert("Không tìm thấy chi tiết hóa đơn");
console.log(error);
return;
}

renderTable(chitiet);

}


function renderTable(list){

const tbody = document.getElementById("tableBody");

tbody.innerHTML = list.map((sp,i)=>`

<tr>

<td>${i+1}</td>

<td>${sp.masp}</td>

<td>${sp.tensp}</td>

<td>${sp.soluong}</td>

<td>
<input class="slgiao"
value="${sp.soluong}"
data-masp="${sp.masp}">
</td>

<td>${sp.dvt || ""}</td>

</tr>

`).join("");

}



async function xuatKho(){

const sohd =
document.getElementById("sohd").value;

const rows =
document.querySelectorAll("#tableBody tr");

let list=[];

rows.forEach(r=>{

const masp =
r.children[1].innerText;

const tensp =
r.children[2].innerText;

const sl =
Number(r.querySelector(".slgiao").value);

const dvt =
r.children[5].innerText;

list.push({
sohd,
masp,
tensp,
soluong:sl,
dvt
});

});


if(!list.length){
alert("Không có sản phẩm");
return;
}


const { error } =
await supabase
.from("stock_ledger")
.insert(list);

if(error){

console.log(error);

alert("Lỗi xuất kho");

return;

}


await truTonKho(list);

alert("Xuất kho thành công");

}



async function truTonKho(list){

for(const sp of list){

await supabase.rpc(
"tru_ton_kho",
{
p_masp: sp.masp,
p_sl: sp.soluong
}
);

}

}

</script>

</body>
</html>
