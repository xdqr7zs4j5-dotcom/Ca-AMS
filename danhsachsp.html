<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Sản phẩm</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#f5f5f7; --card:#fff; --text:#111; --muted:#6b7280; --line:#e5e7eb;
      --blue:#007aff; --red:#ff3b30; --radius:14px; --shadow:0 6px 24px rgba(0,0,0,.06);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; display:flex; flex-direction:column; background:var(--bg);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; color:var(--text)}

    /* Appbar mờ (giống trang Khách hàng) */
    .appbar{
      position:sticky; top:0; z-index:50;
      background:rgba(245,245,247,.78);
      backdrop-filter:saturate(180%) blur(16px);
      border-bottom:1px solid var(--line);
    }
    .appbar-inner{padding:12px 16px}
    .title{margin:0; font-size:18px; font-weight:800; letter-spacing:.2px}

    /* Bộ lọc dạng pill */
    .wrap { padding:16px; display:flex; flex-direction:column; gap:12px; flex:1 1 auto; min-height:0; }
    .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
    .filters{display:flex; flex-wrap:wrap; gap:10px; padding:12px; align-items:center}
    .pill{
      display:flex; align-items:center; gap:8px;
      padding:4px 8px; border:1px solid var(--line); border-radius:999px; background:#fff
    }
    .pill label{font-size:12px; color:var(--muted)}
    .pill input,.pill select{
      border:none; outline:none; font-size:14px; background:transparent; min-height:24px
    }
    .pill select{
      min-width:140px; appearance:none; padding-right:18px;
      background:linear-gradient(45deg,transparent 50%,var(--muted) 50%) right 8px center/8px 8px no-repeat
    }
    .pill .btn{
      border:none; background:var(--blue); color:#fff; padding:8px 12px; border-radius:999px; font-weight:600; cursor:pointer
    }
    .pill .btn:active{opacity:.85}

    /* Meta đếm bên phải */
    .meta{
      margin-left:auto; display:flex; gap:10px; align-items:center; color:var(--muted); font-size:13px
    }
    .chip{background:#eef2ff; color:#1e40af; padding:4px 10px; border-radius:999px; font-weight:700}

    /* Khu bảng (đồng bộ cách Khách hàng dùng card + wrap) */
    .table-card { flex:1 1 auto; min-height:0; padding:8px; }
    .table-wrap{overflow:auto; border-radius:12px; border:1px solid var(--line); background:#fff; height:100%}
    table{width:100%; border-collapse:separate; border-spacing:0}
    thead th{position:sticky; top:0; z-index:1; background:#fafafa; border-bottom:1px solid var(--line); font-size:13px; font-weight:700; color:#374151; text-align:left; padding:10px 12px}
    tbody td{border-bottom:1px solid var(--line); padding:10px 12px; vertical-align:middle; font-size:14px}
    tbody tr:hover{background:#fafbff}
    .cell-check{width:42px}
    .num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}

    /* iOS checkbox */
    input.ios-check{appearance:none; -webkit-appearance:none; outline:none; margin:0; width:20px; height:20px; border-radius:6px; border:1.5px solid #cfd5df; background:#fff; display:inline-grid; place-content:center; cursor:pointer; transition:all .15s}
    input.ios-check:hover{border-color:#b8beca}
    input.ios-check:checked{background:var(--blue); border-color:var(--blue)}
    input.ios-check:checked::after{content:""; width:10px; height:6px; border:2px solid #fff; border-top:0; border-left:0; transform:rotate(45deg) translateY(-1px)}

    /* Ẩn bớt cột phụ trên màn nhỏ (giống tinh thần trang KH) */
    @media (max-width: 900px){
      th:nth-child(8), td:nth-child(8),   /* Quy cách */
      th:nth-child(10), td:nth-child(10), /* Quy cách 2 */
      th:nth-child(11), td:nth-child(11), /* ĐVT 2 */
      th:nth-child(12), td:nth-child(12)  /* Giá nhập */
      {display:none;}
    }
    .btn-barcode{
      width:12px;
      height:12px;
      border-radius:50%;
      border:none;
      cursor:pointer;
      background:var(--red); /* mặc định đỏ */
    }
    .btn-barcode.has-barcode{
      background:#22c55e; /* xanh */
    }
    .bc-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.bc-box{
  background:#fff;
  padding:16px 18px;
  border-radius:14px;
  text-align:center;
  min-width:260px;
  box-shadow:0 20px 40px rgba(0,0,0,.2);
}

.bc-box svg{
  width:100%;
  height:auto;
}

.bc-text{
  margin-top:0;                /* bỏ khoảng hở */
  padding-top:0;
  line-height:1;               /* ép sát chiều cao chữ */
  transform: translateY(-6px); /* kéo số lên sát vạch */
  
  width:100%;
  text-align:center;
  font-weight:700;
  font-size:16px;
  letter-spacing:0.85em;

  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}


  </style>
</head>
<body>

  <div class="wrap">
    <!-- Hàng lọc dạng pill -->
    <div class="card">
      <div class="filters">
        <div class="pill">
          <label>Hành động</label>
          <select id="chonHanhDong">
            <option value="">— Chọn —</option>
            <option value="sua">Sửa</option>
            <option value="xoa">Xóa đã chọn</option>
          </select>
        </div>

        <div class="pill" style="min-width:280px; flex:1">
          <label>Tìm</label>
          <input id="timSP" type="text" placeholder="Tìm theo tên/mã sản phẩm…" style="width:100%">
        </div>

        <div class="pill">
          <button id="btnThemSP" class="btn">➕ Thêm sản phẩm</button>
        </div>

        <!-- Meta đếm -->
        <div class="meta">
          <span>Kết quả:</span><span class="chip" id="demKetQua">0</span>
          <span>| Đã chọn:</span><span class="chip" id="demChon">0</span>
        </div>
      </div>
    </div>

    <!-- Bảng -->
    <div class="card table-card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="cell-check"><input id="chkAll" type="checkbox" class="ios-check"></th>
              <th>Mã SP</th>
              <th></th>
              <th>Tên SP</th>
              <th>Định lượng</th>
              <th class="num">Đơn giá</th>
              <th class="num">Đơn giá 2</th>
              <th class="num">Đơn giá 3</th>
              <th>Đơn vị</th>
              <th>Quy cách</th>
              <th>Đvt</th>
              <th>Quy cách 2</th>
              <th>Đvt 2</th>
              <th class="num">Giá vốn</th>
              <th class="num">Tồn kho</th>
            </tr>
          </thead>
          <tbody id="noiDungBang"></tbody>
        </table>
      </div>
    </div>
  </div>
  <link rel="stylesheet" href="/shared/mobile-fix.css">
  <script src="/shared/mobile-fix.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script type="module">
    import { supabase } from './supabase.config.js';

    let danhSachSP = [], dsHienThi = [];
    const $  = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);

    function fmtNum(n){
      if(n === null || n === undefined || n === '') return '';
      const x = Number(n);
      if(Number.isNaN(x)) return n;
      return x.toLocaleString('vi-VN');
    }

    async function taiSanPham() {
      const { data, error } = await supabase
        .from('sanpham')
        .select('masp,tensp,dinhluong,barcode,dongia,dongia2,dongia3,dvt,quycach,dvtchuyendoi,quycach2,dvtchuyendoi2,giavon,tonkho')
        .order('tensp', { ascending:true });
      if (error) { alert("Lỗi tải dữ liệu: " + error.message); return; }
      danhSachSP = data || [];
      dsHienThi = danhSachSP;
      renderBang(dsHienThi);
    }
   
    function taoRow(sp){
      const hasBC = !!sp.barcode;
      return `
        <tr>
          <td class="cell-check"><input type="checkbox" class="chk ios-check" data-masp="${sp.masp||''}"></td>
          <td class="mono">${sp.masp||''}</td>
          <td>
            <button
              class="btn-barcode ${hasBC ? 'has-barcode' : ''}"
              data-barcode="${sp.barcode||''}">
            </button>
          </td>
          <td>${sp.tensp||''}</td>
          <td>${sp.dinhluong||''}</td>
          <td class="num">${fmtNum(sp.dongia)}</td>
          <td class="num">${fmtNum(sp.dongia2)}</td>
          <td class="num">${fmtNum(sp.dongia3)}</td>
          <td>${sp.dvt||''}</td>
          <td>${sp.quycach||''}</td>
          <td>${sp.dvtchuyendoi||''}</td>
          <td>${sp.quycach2||''}</td>
          <td>${sp.dvtchuyendoi2||''}</td>
          <td class="num">${fmtNum(sp.giavon)}</td>
          <td class="num">${fmtNum(sp.tonkho)}</td>
        </tr>
      `;
    }

    function renderBang(data){
      const tbody = $("#noiDungBang");
      tbody.innerHTML = data.map(taoRow).join("");
      $("#demKetQua").textContent = data.length;

      // events cho checkbox (giống trang Khách hàng)
      $$("#noiDungBang .chk").forEach(cb => cb.addEventListener("change", capNhatDem));
      const master = $("#chkAll"); master.checked = false; master.indeterminate = false;
      capNhatDem();
    }

    function capNhatDem(){
      const chon = $$("#noiDungBang .chk:checked").length;
      $("#demChon").textContent = chon;
      const total = $$("#noiDungBang .chk").length;
      const master = $("#chkAll");
      if(!total){ master.checked=false; master.indeterminate=false; return; }
      if(chon===0){ master.checked=false; master.indeterminate=false; }
      else if(chon===total){ master.checked=true; master.indeterminate=false; }
      else { master.checked=false; master.indeterminate=true; }
    }

    function locVaHienThi(){
      const kw = $("#timSP").value.trim().toLowerCase();
      dsHienThi = danhSachSP.filter(sp =>
        (sp.tensp||'').toLowerCase().includes(kw) ||
        (sp.masp ||'').toLowerCase().includes(kw)
      );
      renderBang(dsHienThi);
    }

    async function xoaSanPham(){
      const items = Array.from($$("#noiDungBang .chk:checked"));
      if(!items.length) return alert("Vui lòng chọn sản phẩm cần xoá.");
      if(!confirm("Bạn có chắc chắn muốn xoá những sản phẩm đã chọn?")) return;
      for (const cb of items){
        const masp = cb.dataset.masp; if(!masp) continue;
        // Nếu bạn dùng xoá mềm: đổi dòng dưới thành update({daxoa:true})
        const { error } = await supabase.from("sanpham").delete().eq("masp", masp);
        if(error){ alert("Lỗi xoá "+masp+": "+error.message); break; }
      }
      await taiSanPham();
    }

    function suaSanPhamTuDanhSach(){
      const items = Array.from($$("#noiDungBang .chk:checked"));
      if(!items.length) return alert("Vui lòng chọn 1 sản phẩm để sửa.");
      if(items.length>1) return alert("Chỉ có thể sửa 1 sản phẩm mỗi lần.");

      const masp = items[0].dataset.masp;

      const win = window.open(
        `nhapsp.html?masp=${encodeURIComponent(masp)}`,
        "_blank",
        "width=760,height=640"
      );

      const timer = setInterval(()=>{
        if(win.closed){
          clearInterval(timer);
          taiSanPham();   // reload danh sách
          }
        },500);
      }

    function showBarcode(code){
  const modal = document.getElementById("barcodeModal");
  modal.style.display = "flex";

  JsBarcode("#barcodeSvg", code, {
    format: "CODE128",
    width: 2,
    height: 110,
    displayValue: false
  });

  document.getElementById("barcodeText").textContent = code;
}
document.addEventListener("click", e=>{
  const btn = e.target.closest(".btn-barcode");
  if(!btn) return;

  const code = btn.dataset.barcode;
  if(!code){
    alert("Sản phẩm chưa có mã vạch");
    return;
  }
  showBarcode(code);
});

    // ===== Events =====
    window.addEventListener("DOMContentLoaded", ()=>{
      /* click nền xám => đóng */
document.getElementById("barcodeModal").addEventListener("click", ()=>{
  document.getElementById("barcodeModal").style.display="none";
});
document.querySelector(".bc-box").addEventListener("click", e=>{
  e.stopPropagation();
});
      taiSanPham();
      $("#timSP").addEventListener("input", locVaHienThi);
      $("#btnThemSP").addEventListener("click", ()=> window.open("nhapsp.html","_blank","width=760,height=640"));
      $("#chonHanhDong").addEventListener("change", function(){
        if(this.value==="xoa") xoaSanPham();
        if(this.value==="sua") suaSanPhamTuDanhSach();
        this.value="";
      });
      $("#chkAll").addEventListener("change", e=>{
        $$("#noiDungBang .chk").forEach(c=>c.checked=e.target.checked);
        capNhatDem();
      });
    });

    // Reload list khi cửa sổ con lưu xong (giữ y hệt trang Khách hàng)
    window.addEventListener("message", (e)=>{ if(e.data?.hanhDong==="taiLaiSP") taiSanPham(); });
  </script>

  <div id="barcodeModal" class="bc-overlay">
  <div class="bc-box">
    <svg id="barcodeSvg"></svg>
    <div class="bc-text" id="barcodeText"></div>
  </div>
</div>

</body>
</html>
