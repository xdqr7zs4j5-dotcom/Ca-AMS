<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tồn kho</title>

<style>
  :root{
    --bg:#f5f5f7; --card:#fff; --text:#111; --muted:#6b7280; --line:#e5e7eb;
    --blue:#007aff; --red:#ff3b30; --radius:14px; --shadow:0 6px 24px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:flex; flex-direction:column; background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; color:var(--text)
  }

  .wrap{padding:8px; display:flex; flex-direction:column; gap:12px; flex:1 1 auto; min-height:0}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
  .filters{display:flex; flex-wrap:wrap; gap:10px; padding:12px; align-items:center}
  .pill{display:flex; align-items:center; gap:8px; padding:4px 8px; border:1px solid var(--line); border-radius:12px; background:#fff}
  .pill label{font-size:12px; color:var(--muted)}
  .pill input,.pill select{border:none; outline:none; font-size:14px; background:transparent; min-height:24px}
  .pill select{
    min-width:140px; appearance:none; padding-right:18px;
    background:linear-gradient(45deg,transparent 50%,var(--muted) 50%) right 8px center/8px 8px no-repeat
  }
  .pill .btn{border:none; background:var(--blue); color:#fff; padding:8px 12px; border-radius:12px; font-weight:600; cursor:pointer}
  .pill .btn:active{opacity:.85}

  .meta{margin-left:auto; display:flex; gap:10px; align-items:center; color:var(--muted); font-size:13px}
  .chip{background:#eef2ff; color:#1e40af; padding:4px 10px; border-radius:999px; font-weight:700}

  .table-card{flex:1 1 auto; min-height:0; padding:8px}
  .table-wrap{overflow:auto; border-radius:12px; border:1px solid var(--line); background:#fff; height:100%}
  table{width:100%; border-collapse:separate; border-spacing:0}
  thead th{
    position:sticky; top:0; z-index:1; background:#fafafa; border-bottom:1px solid var(--line);
    font-size:13px; font-weight:700; color:#374151; text-align:left; padding:10px 12px
  }
  tbody td{border-bottom:1px solid var(--line); padding:10px 12px; vertical-align:middle; font-size:14px}
  tbody tr:hover{background:#fafbff}
  .cell-check{width:42px}
  .num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  .lowText{color:var(--red); font-weight:700}

  @media (max-width: 900px){
    th:nth-child(4), td:nth-child(4){display:none;} /* Ẩn ĐVT trên màn nhỏ */
  }
</style>
</head>
<body>

<div class="wrap">
  <!-- Hàng lọc -->
  <div class="card">
    <div class="filters">
      <div class="pill">
        <label>Kho</label>
        <select id="kho"></select>
      </div>

      <div class="pill" style="min-width:280px; flex:1">
        <label>Tìm</label>
        <input id="timSP" type="text" placeholder="Tìm theo tên hoặc mã SP…" style="width:100%">
      </div>

      <div class="pill">
        <label>Lọc tồn</label>
        <select id="locTon">
          <option value="all">Tất cả</option>
          <option value="neg">Âm (&lt; 0)</option>
          <option value="lt50">&lt; 50</option>
        </select>
      </div>

      <!-- THÊM: khoảng ngày -->
      <div class="pill">
        <label>Từ</label>
        <input id="fromDate" type="date">
      </div>
      <div class="pill">
        <label>Đến</label>
        <input id="toDate" type="date">
      </div>

      <div class="meta">
        <span>Kết quả:</span><span class="chip" id="demKetQua">0</span>
        <span>| Đã chọn:</span><span class="chip" id="demChon">0</span>
        <span>| Tổng tồn cuối:</span><span class="chip" id="tongTon">0</span>
      </div>
    </div>
  </div>

  <!-- Bảng -->
  <div class="card table-card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="cell-check"><input id="chkAll" type="checkbox" class="ios-check"></th>
            <th>Mã SP</th>
            <th>Tên SP</th>
            <th>Đvt</th>
            <th class="num">Tồn đầu</th>
            <th class="num">Tăng</th>
            <th class="num">Giảm</th>
            <th class="num">Tồn cuối</th>
          </tr>
        </thead>
        <tbody id="noiDungBang"></tbody>
      </table>
    </div>
  </div>
</div>
<link rel="stylesheet" href="/shared/mobile-fix.css">
<script src="/shared/mobile-fix.js" defer></script>

<!-- JS -->
<script type="module">
import { supabase } from "./supabase.config.js";

const $ = s => document.querySelector(s);

const tb        = $("#noiDungBang");
const ipTim     = $("#timSP");
const selLocTon = $("#locTon");
const lblCount  = $("#demKetQua");
const lblTong   = $("#tongTon");
const ipFrom    = $("#fromDate");
const ipTo      = $("#toDate");
const selKho    = $("#kho");

let VIEW = [];

// ===== utils =====
const noAccent = s => (s||"").normalize("NFD").replace(/\p{Diacritic}/gu,"").toLowerCase();
const fmt = n => (Number(n)||0).toLocaleString("vi-VN");

// ===== init date =====
(function initDates(){
  const today = new Date();
  const start = new Date();
  start.setDate(today.getDate()-30);
  ipTo.value   = today.toISOString().slice(0,10);
  ipFrom.value = start.toISOString().slice(0,10);
})();

async function loadKho(){
  const { data } = await supabase
    .from("thietlap_kho")
    .select("id, ten_kho");

  const sel = document.getElementById("kho");

  sel.innerHTML = 
    `<option value="all">Tất cả kho</option>` +
    data.map(k =>
    `<option value="${k.id}">${k.ten_kho}</option>`
  ).join("");
} 
// ===== load report =====
async function loadReport(){
  let kho_id = selKho.value;

  if (!kho_id || kho_id === "all") {
    kho_id = null;
  }
  if (!ipFrom.value || !ipTo.value) return;

  const { data, error } = await supabase.rpc("bao_cao_ton", {
    p_kho_id: kho_id,
    p_tu_ngay: ipFrom.value,
    p_den_ngay: ipTo.value
  });

  if(error){
    console.error("Lỗi báo cáo:", error);
    return;
  }

  // 🔥 data chính, không cần RAW
  VIEW = (data || []).map(r => ({
    masp: r.masp,
    tensp: r.tensp,
    dvt: r.dvt,
    open: Number(r.ton_dau) || 0,
    inc:  Number(r.tang) || 0,
    dec:  Number(r.giam) || 0,
    close:Number(r.ton_cuoi) || 0
  }));

  applyFilterAndRender();
}

// ===== filter + render =====
function applyFilterAndRender(){
  const q  = noAccent(ipTim.value.trim());
  const mode = selLocTon.value;

  let ds = VIEW.filter(r => {
  if (q) {
    const hit =
      noAccent(r.masp).includes(q) ||
      noAccent(r.tensp).includes(q);

    if (!hit) return false;
  }

  if (mode === "neg")  return r.close < 0;
  if (mode === "lt50") return r.close < 50;

  return true;
});

  render(ds);
  updateMeta(ds);
}

// ===== render =====
function render(ds){
  tb.innerHTML = "";

  const frag = document.createDocumentFragment();

  ds
    .sort((a,b)=> a.close - b.close)
    .forEach(r=>{
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td><input type="checkbox"></td>
        <td>${r.masp}</td>
        <td>${r.tensp}</td>
        <td>${r.dvt}</td>
        <td class="num">${fmt(r.open)}</td>
        <td class="num">${fmt(r.inc)}</td>
        <td class="num">${fmt(r.dec)}</td>
        <td class="num ${r.close < 0 ? 'lowText':''}">
          ${fmt(r.close)}
        </td>
      `;

      frag.appendChild(tr);
    });

  tb.appendChild(frag);
}

// ===== meta =====
function updateMeta(ds){
  $("#demKetQua").textContent = ds.length;

  const sum = ds.reduce((s,r)=> s + r.close, 0);
  $("#tongTon").textContent = fmt(sum);
}

// ===== events =====
let t;
ipTim.addEventListener("input", ()=>{
  clearTimeout(t);
  t = setTimeout(applyFilterAndRender, 120);
});

selLocTon.addEventListener("change", applyFilterAndRender);
ipFrom.addEventListener("change", loadReport);
ipTo.addEventListener("change", loadReport);
selKho.addEventListener("change", loadReport);

window.addEventListener("DOMContentLoaded", async () => {
  await loadKho();
  await loadReport();
});
</script>
</body>
</html>
