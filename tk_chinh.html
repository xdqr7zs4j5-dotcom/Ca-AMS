<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kiểm kho</title>

<style>
  :root{
    --bg:#f5f5f7; --card:#fff; --text:#111; --muted:#6b7280; --line:#e5e7eb;
    --blue:#007aff; --red:#ff3b30; --radius:14px; --shadow:0 6px 24px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:flex; flex-direction:column; background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; color:var(--text)
  }
 
  .wrap{padding:8px; display:flex; flex-direction:column; gap:12px; flex:1 1 auto; min-height:0}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; padding:12px; align-items:center}
  .pill{display:flex; align-items:center; gap:8px; padding:4px 8px; border:1px solid var(--line); border-radius:12px; background:#fff}
  .pill label{font-size:12px; color:var(--muted)}
  .pill input,.pill select{border:none; outline:none; font-size:14px; background:transparent; min-height:24px}
  .pill select{
    min-width:140px; appearance:none; padding-right:18px;
    background:linear-gradient(45deg,transparent 50%,var(--muted) 50%) right 8px center/8px 8px no-repeat
  }
  .btn{border:none; background:var(--blue); color:#fff; padding:8px 12px; border-radius:12px;
      font-weight:600; cursor:pointer}
  .btn:active{opacity:.85}
  

 
  input, select {
  border: none;
  outline: none;
  background: transparent;
  box-shadow: none;
  appearance: none;
}

  .table-card{flex:1 1 auto; min-height:0; padding:8px}
  .table-wrap{overflow:auto; border-radius:12px; border:1px solid var(--line); background:#fff; height:100%}
  table{width:100%; border-collapse:separate; border-spacing:0}
  thead th{
    position:sticky; top:0; z-index:1; background:#fafafa; border-bottom:1px solid var(--line);
    font-size:13px; font-weight:700; color:#374151; text-align:left; padding:10px 12px
  }
  tbody td{border-bottom:1px solid var(--line); padding:10px 12px; vertical-align:middle; font-size:14px}
  tbody tr:hover{background:#fafbff}
  .cell-check{width:42px}
  .num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  .lowText{color:var(--red); font-weight:700}

  @media (max-width: 900px){
    th:nth-child(4), td:nth-child(4){display:none;} /* Ẩn ĐVT trên màn nhỏ */
  }
</style>
</head>

<body>

<div class="wrap">

  <!-- Thông tin -->
  <div class="card">
    <div class="section">
      <div class="toolbar">
        <div class="pill" style="min-width:180px">
          <label>Kho</label>
          <select id="kho"></select>
        
        </div>
        <div class="pill">
          <label>Ngày</label>
          <input type="date" id="ngay">
        </div>

        <div class="pill" style="min-width:180px">
          <label>Chứng từ</label>
          <input id="chungTu">
        </div>

        <div class="pill" style="min-width:140px">
          <label>Mã KH</label>
          <input id="maKH">
        </div>

        <div class="pill" style="flex:1;min-width:220px">
          <label>Lọc</label>
          <input id="filter" placeholder="Gõ mã hoặc tên SP…">
        </div>

        <button class="btn primary" id="luu">Lưu kiểm kho</button>
      </div>
    </div>
  </div>

  <!-- Bảng -->
  <div class="card table-card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:110px">Mã SP</th>
            <th>Tên SP</th>
            <th class="num" style="width:130px">Tồn hiện tại</th>
            <th class="num" style="width:140px;text-align:center;">Tồn thực tế</th>
            <th class="num" style="width:130px">Chênh lệch</th>
            <th style="width:200px; text-align:center;">Ghi chú</th>
            <th class="num" style="width:130px">Tồn sau</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>
<link rel="stylesheet" href="/shared/mobile-fix.css">
<script src="/shared/mobile-fix.js" defer></script>
<script type="module">
import { supabase } from "./supabase.config.js";

const tbody = document.getElementById('tbody');
const fmt = n => Number(n||0).toLocaleString('vi-VN');
const num = v => Number(String(v||'').replaceAll('.',''))||0;

// set ngày hôm nay
const d = new Date();
ngay.value = d.toISOString().slice(0,10);

async function loadKho(){
  const { data, error } = await supabase
    .from("thietlap_kho")
    .select("id, ten_kho");

  if(error){
    alert(error.message);
    return;
  }

  const sel = document.getElementById("kho");

  sel.innerHTML =
    data.map(k =>
    `<option value="${k.id}">${k.ten_kho}</option>`
  ).join("");
}

/* LOAD SẢN PHẨM */
async function loadAll(){
  const kho_id = document.getElementById('kho').value;

  if (!kho_id) {
    tbody.innerHTML = '';
    return;
  }

  const { data, error } = await supabase
    .from('v_tonkho')
    .select('masp, tensp, ton')
    .eq('kho_id', kho_id);

  if (error) {
    alert(error.message);
    return;
  }

  tbody.innerHTML = '';

  data.forEach(sp => {
    const ton = sp.ton || 0;

    const tr = document.createElement('tr');
    tr.dataset.masp = sp.masp;

    tr.innerHTML = `
      <td class="mono"><span class="pill-mini">${sp.masp}</span></td>
      <td>${sp.tensp}</td>
      <td class="num ton">${fmt(ton)}</td>
      <td class="num">
        <input class="thucte" type="number" style="width:100px;text-align:right">
      </td>
      <td class="num chenhlech"></td>
      <td style="text-align:center;">
        <select class="note">
          <option value="">—</option>
          <option value="kiemkho">Kiểm kho</option>
          <option value="hu_hong">Hư hỏng</option>
          <option value="mat_mat">Mất mát</option>
        </select>
      </td>
      <td class="num sau">${fmt(ton)}</td>
    `;

    tr.querySelector('.thucte').addEventListener('input', () => calc(tr));

    tbody.appendChild(tr);
  });
}
document.getElementById('kho')
  .addEventListener('change', loadAll);

function calc(tr){
  const ton=num(tr.querySelector('.ton').textContent);
  const input=tr.querySelector('.thucte');
  if(input.value===''){
    tr.querySelector('.chenhlech').textContent='';
    tr.querySelector('.sau').textContent=fmt(ton);
    tr.style.background='';
    return;
  }
  const thucte=num(input.value);
  const cl=thucte-ton;
  tr.querySelector('.chenhlech').textContent=(cl>0?'+':'')+fmt(cl);
  tr.querySelector('.sau').textContent=fmt(thucte);
  tr.style.background=cl>0?'#f0fdf4':cl<0?'#fef2f2':'';
}

filter.oninput=e=>{
  const kw=e.target.value.toLowerCase();
  tbody.querySelectorAll('tr').forEach(tr=>{
    tr.style.display=
      (tr.innerText.toLowerCase().includes(kw))?'':'none';
  });
};

luu.onclick = async () => {
  luu.disabled = true;

  try {
    const kho_id = document.getElementById('kho').value;
    if (!kho_id) {
      alert('Chọn kho');
      return;
    }

    const chungtuVal = chungTu.value?.trim() || null;

    chungTu.value = chungtuVal;

    const items = [];

    for (const tr of tbody.querySelectorAll('tr')) {
      const masp = tr.dataset.masp;
      const ton = num(tr.querySelector('.ton').textContent);
      const thucteVal = tr.querySelector('.thucte').value;

      if (thucteVal === '') continue;

      const thucte = num(thucteVal);
      const chenhlech = thucte - ton;

      if (chenhlech === 0) continue;

      items.push({
        masp,
        kho_id: kho_id,
        soluong: chenhlech
      });
    }

    if (items.length === 0) {
      alert('Không có thay đổi');
      return;
    }

    const { data, error } = await supabase.rpc('tao_chungtu', {
      p_phanloai: 'kk',
      p_items: items,
      p_ghichu: "ctk"
    });

    if (error) throw error;

    alert(`✅ Đã tạo chứng từ ${data}`);

    await loadAll();

  } catch (e) {
    console.error(e);
    alert('❌ Lỗi khi chỉnh tồn');
  } finally {
    luu.disabled = false;
  }
};
window.addEventListener("DOMContentLoaded", async () => {
  await loadKho();
  await loadAll();
});

</script>

</body>
</html>
